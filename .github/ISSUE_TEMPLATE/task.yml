name: タスク
description: 機能でもバグでもない作業(設定・調査・ドキュメント・リファクタ)
title: "chore: "
labels: [task]
body:
  - type: dropdown
    id: area
    attributes:
      label: 領域
      options: [ios, backend/appconfig, backend/ai, dsl, infra, docs, github]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 内容
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了の条件
      description: 何ができたら閉じてよいか。確かめ方(実機 / curl / テスト)まで書く。
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 依存
      description: 先に終わっている必要がある Issue / PR(#番号)。無ければ「なし」。
      placeholder: なし
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: 期限(目安)
      placeholder: Day1 昼 / Day2 午前 など
