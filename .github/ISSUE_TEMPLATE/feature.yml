name: 機能追加
description: 新しい機能・画面・API の提案
title: "feat: "
labels: [feature]
body:
  - type: dropdown
    id: area
    attributes:
      label: 領域
      options: [ios, backend/appconfig, backend/ai, dsl, infra, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: やりたいこと
      description: ユーザー視点で1〜3行。デモのどのシーンで使うか。
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: 実現方法(案)
      description: 画面 / エンドポイント / DSL の変更点など。未定なら空でOK。
  - type: textarea
    id: done
    attributes:
      label: 完了の条件
      description: 何ができたら閉じてよいか。確かめ方(実機 / curl / テスト)まで書く。
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 依存
      description: 先に終わっている必要がある Issue / PR(#番号)。無ければ「なし」。
      placeholder: なし
    validations:
      required: true
