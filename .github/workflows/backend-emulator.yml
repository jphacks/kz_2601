# backend の Firestore エミュレータ試験(#546)。backend-ci は 5 分上限なので別 workflow にしている。
#
# 設計メモ:
# - workflow レベルの `paths:` は使わない(backend-ci.yml と同じ理由: required check が永遠に待ちになる)。
#   `backend-emulator-changes` で変更有無を判定し、試験ジョブ `backend-emulator-test` を `if:` で飛ばす。
# - required check 名 = 集約ジョブ `backend-emulator`(試験を飛ばした時は成功、回した時はその結果)。
#   登録は人(scripts/github/setup-branch-protection.sh)。
# - エミュレータは gcloud SDK の `cloud-firestore-emulator` コンポーネント(バージョン固定)。
#   docker イメージより取得が軽く、firebase-tools と違って firebase.json が要らない。
# - プロジェクトは `demo-kz2601` 固定(テスト側もハードコード)。`demo-` プロジェクトは実 GCP に
#   繋がらない。認証情報も secrets も渡さない。
# - firestore.rules / indexes はリポジトリに無いのでフィルタに入れていない。追加したら足すこと。
name: backend-emulator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]

concurrency:
  group: backend-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-emulator-changes:
    name: backend-emulator-changes
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.filter.outputs.emulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # push では github.event.before との差分、PR では base との差分。
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            emulator:
              - 'backend/**'
              - '.github/workflows/backend-emulator.yml'
              - 'scripts/firestore-emulator.sh'

  backend-emulator-test:
    name: backend-emulator-test
    needs: backend-emulator-changes
    if: needs.backend-emulator-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      GOOGLE_CLOUD_PROJECT: demo-kz2601
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '542.0.0'
          install_components: cloud-firestore-emulator

      # 起動・待ち・試験は scripts/firestore-emulator.sh(make -C backend test-emulator と共用)
      - name: Firestore エミュレータ起動
        run: |
          nohup ../scripts/firestore-emulator.sh start > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ../scripts/firestore-emulator.sh wait || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }

      - name: go test(エミュレータ試験のあるパッケージ)
        run: ../scripts/firestore-emulator.sh test

      - name: エミュレータログ(失敗時)
        if: failure()
        run: cat "$RUNNER_TEMP/emulator.log" || true

  # required check。試験を飛ばした時は成功、回した時はその結果。判定の失敗/キャンセルは失敗。
  backend-emulator:
    name: backend-emulator
    needs: [backend-emulator-changes, backend-emulator-test]
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 結果を集約
        env:
          CHANGES: ${{ needs.backend-emulator-changes.result }}
          TEST: ${{ needs.backend-emulator-test.result }}
          RUN: ${{ needs.backend-emulator-changes.outputs.run }}
        run: |
          echo "run=${RUN} backend-emulator-changes=${CHANGES} backend-emulator-test=${TEST}"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::backend-emulator-changes が ${CHANGES}"
            exit 1
          fi
          if [ "$RUN" = "true" ] && [ "$TEST" != "success" ]; then
            echo "::error::backend-emulator-test が ${TEST}"
            exit 1
          fi
          if [ "$RUN" != "true" ] && [ "$TEST" != "skipped" ]; then
            echo "::error::backend-emulator-test が ${TEST}(変更なしなのに)"
            exit 1
          fi
