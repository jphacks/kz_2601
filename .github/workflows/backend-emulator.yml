# backend の Firestore エミュレータ試験(#546)。backend-ci は 5 分上限なので別 workflow にしている。
#
# 設計メモ:
# - required check ではない(必須化はリポジトリ設定=人間の判断)。required でないので workflow の
#   `paths:` フィルタを使ってよい(backend-ci の "Expected" 待ち問題は起きない)。
#   必須化するときは backend-ci と同じく paths-filter ジョブ + `if:` に書き換えること。
# - エミュレータは gcloud SDK の `cloud-firestore-emulator` コンポーネント(バージョン固定)。
#   docker イメージより取得が軽く、firebase-tools と違って firebase.json が要らない。
# - プロジェクトは `demo-kz2601` 固定(テスト側もハードコード)。`demo-` プロジェクトは実 GCP に
#   繋がらない。認証情報も secrets も渡さない。
# - firestore.rules / indexes はリポジトリに無いので paths に入れていない。追加したら足すこと。
name: backend-emulator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-emulator.yml'
      - 'scripts/firestore-emulator.sh'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-emulator.yml'
      - 'scripts/firestore-emulator.sh'

concurrency:
  group: backend-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-emulator:
    name: backend-emulator
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      GOOGLE_CLOUD_PROJECT: demo-kz2601
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '542.0.0'
          install_components: cloud-firestore-emulator

      # 起動・待ち・試験は scripts/firestore-emulator.sh(make -C backend test-emulator と共用)
      - name: Firestore エミュレータ起動
        run: |
          nohup ../scripts/firestore-emulator.sh start > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ../scripts/firestore-emulator.sh wait || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }

      - name: go test(エミュレータ試験のあるパッケージ)
        run: ../scripts/firestore-emulator.sh test

      - name: エミュレータログ(失敗時)
        if: failure()
        run: cat "$RUNNER_TEMP/emulator.log" || true
