# 秘密情報の混入検知(gitleaks)。public リポジトリなので最重要の防衛線。
#
# - gitleaks/gitleaks-action は organization 所有リポ(jphacks)だと有料ライセンス(GITLEAKS_LICENSE)必須のため使わない。
#   代わりに gitleaks CLI 本体(MIT・無料)を公式 Release からバージョン固定で取得して直接実行する。
# - Draft PR でも実行する(push された時点で既に public に出ているため、早いほど良い。ubuntu で数十秒)。
#   ※ 他ワークフローの「Draft では発火しない」ルールの意図的な例外。
# - PR では base..head の差分コミットのみ、develop/main への push では全履歴を走査する。
# - required check 名 = ジョブ名 `secrets-scan`。
# - 誤検知は `.gitleaksignore` に fingerprint を追加して抑止する。本物なら即キーをローテートする。
name: secrets-scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]

concurrency:
  group: secrets-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # PR の全コミット / 全履歴を走査する

      - name: gitleaks CLI を取得(バージョン固定)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: gitleaks detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(detect --source . --redact -v --no-banner --exit-code 1)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "scan range: ${BASE_SHA}..${HEAD_SHA}"
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          else
            echo "scan: full history"
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" "${args[@]}"
