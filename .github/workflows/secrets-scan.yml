# 秘密情報の混入検知(gitleaks)。public リポジトリなので最重要の防衛線。
#
# - Draft PR でも実行する(push された時点で既に public に出ているため、早いほど良い。ubuntu で数十秒)。
#   ※ 他ワークフローの「Draft では発火しない」ルールの意図的な例外。
# - required check 名 = ジョブ名 `secrets-scan`。
# - 個人アカウント / 無料 org のリポジトリでは GITLEAKS_LICENSE は不要。
name: secrets-scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]

concurrency:
  group: secrets-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # 検出時に PR へコメントするため(不要なら read に下げる)

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PR の全コミットを走査する

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
