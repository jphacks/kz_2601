# シェルスクリプトと workflows の CI(#574)。shellcheck・scripts/ai-cost-test.sh・actionlint・ライセンスの一覧の鮮度(#306)。
# required check にはしていないので、workflow レベルの paths フィルタで対象を触った時だけ動かす。
# shellcheck / actionlint は公式 Release からバージョン固定で取得する(runner 同梱版の更新で結果が変わらないように)。
name: scripts-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["**/*.sh", "scripts/**", ".github/workflows/**", "ios/scripts/**", "**/Package.resolved", "ios/Metamon/Resources/ThirdPartyLicenses.json", "LICENSE", "docs/infra/runtime-config.md"]
  push:
    branches: [develop, main]
    paths: ["**/*.sh", "scripts/**", ".github/workflows/**", "ios/scripts/**", "**/Package.resolved", "ios/Metamon/Resources/ThirdPartyLicenses.json", "LICENSE", "docs/infra/runtime-config.md"]

concurrency:
  group: scripts-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: "0.11.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  shellcheck:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck を取得(バージョン固定)
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"
      - name: shellcheck(追跡中の *.sh 全部)
        run: |
          set -euo pipefail
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck

  # deploy-cloudrun.yml の --update-env-vars と docs/infra/runtime-config.md の表が合っているか(#509)。
  # デプロイの時にしか見ていなかったため、合わない PR がマージされて stg のデプロイが止まった(2026-11-07)。
  deploy-env-check:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-deploy-env.sh

  ai-cost-test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ai-cost-test.sh # jq は runner に同梱
      - run: scripts/runner-usage-test.sh # runner.usage の集計(#345)
      - run: scripts/demo-check-test.sh # demo-check の版・env 照合(偽の curl)

  # アプリに同梱するライセンスの一覧(#306)。Package.resolved・LICENSE が変わったのに一覧が古いと落ちる。
  # ubuntu にはパッケージのチェックアウトが無いので、依存(identity・版・revision)と LICENSE の照合だけ
  licenses-check:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 ios/scripts/third-party-licenses.py --check

  actionlint:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint を取得(バージョン固定)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >>"$GITHUB_PATH"
      - name: actionlint(.github/workflows/*.yml)
        run: |
          actionlint -version
          actionlint -color
