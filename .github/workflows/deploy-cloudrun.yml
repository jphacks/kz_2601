# Cloud Run デプロイ。構築済みの GCP 環境(docs/infra/gcp-setup.md)と 1:1 で対応する。
#   develop への push → appconfig-stg / ai-stg
#   main    への push → appconfig-prod / ai-prod
#   workflow_dispatch → 環境を選んで手動実行(backend 未変更でも強制デプロイ)
#
# 流れ: docker build(backend/Dockerfile・appconfig/ai 両バイナリ同梱)を 1 回
#   → Artifact Registry `<region>-docker.pkg.dev/<project>/backend/backend:<sha>` に push
#   → 同じイメージで appconfig-<env> と ai-<env>(--command=/app/ai)を `gcloud run deploy --image`
#   → 両サービスの GET /health が 200 を返すことを確認し、URL を job summary に出す。
#
# 認証: Workload Identity Federation(鍵ファイル無し)。GitHub 側に Secrets は不要。
#   repo Variables: GCP_PROJECT_ID / GCP_REGION / GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT
#   deployer SA に必要な IAM: roles/run.admin, roles/artifactregistry.writer,
#     roles/iam.serviceAccountUser(run-backend に対して), roles/iam.workloadIdentityUser(WIF principalSet から)
#   ANTHROPIC_API_KEY は GCP Secret Manager(同名)から --set-secrets で ai に注入する。
#
# 設計メモ:
# - workflow レベルの `paths:` は使わない(backend-ci.yml と同じ理由: required check 化した時に
#   "Expected" のまま詰まる)。代わりに `deploy-changes` ジョブ(dorny/paths-filter)で
#   backend/** とこのファイルの変更有無を判定し、本体ジョブを `if:` で skip する。
# - ヘルスパスは /health。Cloud Run の Google Front End は /healthz をコンテナに届けない(実測・HTML 404)。
# - --set-env-vars / --set-secrets は全置換。手動で足した env/secret は次のデプロイで消えるので
#   必要なものはここに書く。
name: deploy-cloudrun

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先
        type: choice
        required: true
        default: staging
        options: [staging, production]

# 同じ環境へのデプロイは直列化(古い実行はキャンセルしない: 中途半端な状態を避ける)
concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF に必須

jobs:
  deploy-changes:
    name: deploy-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      environment: ${{ steps.target.outputs.environment }}
      suffix: ${{ steps.target.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 20

      # push では直前のコミット(push 前の HEAD)との差分で判定する
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-cloudrun.yml'

      - id: target
        env:
          INPUT_ENV: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # AUTH_MODE 未設定 = firebase(Admin SDK で ID トークン検証)。Firestore は GOOGLE_CLOUD_PROJECT + FIRESTORE_DATABASE + run-backend SA の ADC。
          if [ -n "$INPUT_ENV" ]; then
            environment="$INPUT_ENV"
          elif [ "$REF_NAME" = "main" ]; then
            environment="production"
          else
            environment="staging"
          fi
          case "$environment" in
            production) suffix="prod" ;;
            *)          suffix="stg" ;;
          esac
          {
            echo "environment=$environment"
            echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
          echo "target: $environment (appconfig-$suffix / ai-$suffix)"

  deploy:
    name: deploy
    needs: deploy-changes
    if: needs.deploy-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # デプロイ ~10 分 + スモーク(staging: Claude 3 回 / production: 2 回・~1 分)
    environment:
      name: ${{ needs.deploy-changes.outputs.environment }}
      url: ${{ steps.appconfig.outputs.url }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUN_SA: run-backend@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      ENV_SUFFIX: ${{ needs.deploy-changes.outputs.suffix }}
      # Firestore の接続先(#290・backend/internal/fsenv)。今は stg / prod とも同じプロジェクトの (default)。
      # APP_ENV=stg が本番の DB を使うと起動を止めるので、分離(#291・#293)までは stg だけ ALLOW_SHARED_PROD_DB=1。
      # 分離したら stg 側を新しい接続先にして ALLOW_SHARED_PROD_DB を外す。
      FIRESTORE_DATABASE: '(default)'
      ALLOW_SHARED_PROD_DB: ${{ needs.deploy-changes.outputs.suffix == 'stg' && '1' || '0' }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/backend/backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: GCP 認証(Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Docker build & push(Artifact Registry)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -f backend/Dockerfile -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "pushed: $IMAGE"

      - name: Deploy appconfig-${{ env.ENV_SUFFIX }}
        id: appconfig
        run: |
          set -euo pipefail
          gcloud run deploy "appconfig-${ENV_SUFFIX}" \
            --image="$IMAGE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --service-account="$RUN_SA" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=3 \
            --concurrency=80 --timeout=60 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIRESTORE_DATABASE=${FIRESTORE_DATABASE},APP_ENV=${ENV_SUFFIX},ALLOW_SHARED_PROD_DB=${ALLOW_SHARED_PROD_DB},GIT_SHA=${GITHUB_SHA}" \
            --quiet
          url="$(gcloud run services describe "appconfig-${ENV_SUFFIX}" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "appconfig-${ENV_SUFFIX}: $url"

      - name: Deploy ai-${{ env.ENV_SUFFIX }}
        id: ai
        env:
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
        run: |
          set -euo pipefail
          # 同じイメージを /app/ai で起動。Claude 呼び出しは数十秒かかるので timeout=300
          # APPCONFIG_BASE_URL は cmd/ai/main.go が読む名前(未設定だと ai はインメモリ stub で動き appconfig を叩かない)。
          # ai → appconfig はクライアントの Firebase ID トークンをそのまま転送するので Cloud Run 間の追加認証は不要。
          gcloud run deploy "ai-${ENV_SUFFIX}" \
            --image="$IMAGE" \
            --command=/app/ai \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --service-account="$RUN_SA" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=3 \
            --concurrency=20 --timeout=300 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIRESTORE_DATABASE=${FIRESTORE_DATABASE},APP_ENV=${ENV_SUFFIX},ALLOW_SHARED_PROD_DB=${ALLOW_SHARED_PROD_DB},APPCONFIG_BASE_URL=${APPCONFIG_BASE_URL},GIT_SHA=${GITHUB_SHA}" \
            --set-secrets="ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" \
            --quiet
          url="$(gcloud run services describe "ai-${ENV_SUFFIX}" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ai-${ENV_SUFFIX}: $url"

      - name: ヘルスチェック(GET /health が 200)
        env:
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
          AI_URL: ${{ steps.ai.outputs.url }}
        run: |
          set -euo pipefail
          for url in "$APPCONFIG_BASE_URL" "$AI_URL"; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${url}/health"
            echo " <- ${url}/health OK"
          done

      - name: Job summary
        env:
          ENVIRONMENT: ${{ needs.deploy-changes.outputs.environment }}
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
          AI_URL: ${{ steps.ai.outputs.url }}
        run: |
          {
            echo "## Cloud Run deploy: ${ENVIRONMENT}"
            echo
            echo "| service | URL | health |"
            echo "|---|---|---|"
            echo "| appconfig-${ENV_SUFFIX} | ${APPCONFIG_BASE_URL} | [/health](${APPCONFIG_BASE_URL}/health) 200 |"
            echo "| ai-${ENV_SUFFIX} | ${AI_URL} | [/health](${AI_URL}/health) 200 |"
            echo
            echo "image: \`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- スモーク(staging / production・Day2 の保険・非ブロッキング) -----------------
      # デモ発話を実 API で流し、表を job summary に貼る。失敗してもデプロイは成功扱い(continue-on-error)。
      #   staging:    デモ 3 本(家計簿 create → edit → undo / 筋トレ / 散歩)。Claude 3 回(~30 秒)。
      #   production: Claude 費用を抑えるため家計簿 1 本だけ(-only kakeibo・Claude 2 回)。さらに
      #               -cleanup で作った smoke-* アプリを DELETE /v1/apps/{id}(archive)して Firestore に残さない。
      # appconfig は AUTH_MODE=firebase なので dev トークンは通らない → Firebase 匿名ユーザーの
      # ID トークンを identitytoolkit REST で取る。FIREBASE_WEB_API_KEY は repo Variables
      # (Firebase Web API key = クライアント配布される公開情報)。未設定 / 取得失敗なら
      # cmd/smoke が health と「未認証 generate が 401」の確認だけにフォールバックする。
      - uses: actions/setup-go@v7
        if: contains(fromJSON('["staging","production"]'), needs.deploy-changes.outputs.environment)
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod

      - name: Smoke(${{ needs.deploy-changes.outputs.environment }}・非ブロッキング)
        if: contains(fromJSON('["staging","production"]'), needs.deploy-changes.outputs.environment)
        continue-on-error: true
        working-directory: backend
        env:
          ENVIRONMENT: ${{ needs.deploy-changes.outputs.environment }}
          AI_URL: ${{ steps.ai.outputs.url }}
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: |
          set -o pipefail
          extra=()
          if [ "$ENVIRONMENT" = "production" ]; then
            extra=(-only kakeibo -cleanup)
          fi
          {
            printf '\n## Smoke(%s)\n\n' "$ENVIRONMENT"
            if [ "$ENVIRONMENT" = "production" ]; then
              echo "家計簿 1 本(create → edit → undo)のみ。作った smoke-* アプリは終了時に archive(-cleanup)。"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/smoke -ai "$AI_URL" -appconfig "$APPCONFIG_BASE_URL" \
            -firebase-api-key "$FIREBASE_WEB_API_KEY" -timeout 120s "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
