# Cloud Run デプロイ。構築済みの GCP 環境(docs/infra/gcp-setup.md)と 1:1 で対応する。
#   develop への push → appconfig-stg / ai-stg
#   main    への push → appconfig-prod / ai-prod
#   workflow_dispatch → 環境を選んで手動実行(backend 未変更でも強制デプロイ)
#
# 流れ: docker build(backend/Dockerfile・appconfig/ai 両バイナリ同梱)を 1 回
#   → Artifact Registry `<region>-docker.pkg.dev/<project>/backend/backend:<sha>` に push
#   → 同じイメージで appconfig-<env> と ai-<env>(--command=/app/ai)を `gcloud run deploy --image`
#   → 両サービスの GET /health が 200 を返すことを確認し、URL を job summary に出す。
#   → production で変数 RUNNER_DEPLOY=1 の時だけ、同じイメージで runner-prod(--command=/app/runner・非公開)。
#     stg には出さない(#288 の分離まで runner は prod だけ・docs/00_decisions.md「M4」)。手順は docs/infra/runner.md
#
# 認証: Workload Identity Federation(鍵ファイル無し)。GitHub 側に Secrets は不要。
#   repo Variables: GCP_PROJECT_ID / GCP_REGION / GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT
#   deployer SA に必要な IAM: roles/run.admin, roles/artifactregistry.writer,
#     roles/iam.serviceAccountUser(run-backend に対して), roles/iam.workloadIdentityUser(WIF principalSet から)
#   ANTHROPIC_API_KEY は GCP Secret Manager(同名)から --set-secrets で ai に注入する。
#   repo / Environment Variables(任意): APP_CHECK_MODE・FIRESTORE_DATABASE(未設定なら off・(default))
#
# 設計メモ:
# - workflow レベルの `paths:` は使わない(backend-ci.yml と同じ理由: required check 化した時に
#   "Expected" のまま詰まる)。代わりに `deploy-changes` ジョブ(dorny/paths-filter)で
#   backend/** とこのファイルの変更有無を判定し、本体ジョブを `if:` で skip する。
# - ヘルスパスは /health。Cloud Run の Google Front End は /healthz をコンテナに届けない(実測・HTML 404)。
# - 環境変数は --update-env-vars(#509)。ここに書いた「ワークフローが毎回決める値」だけを上書きし、
#   運用で gcloud から入れた値(NOTICE_JSON・MIN_IOS_BUILD・RATE_LIMIT_GLOBAL_DAILY など)は残す。
#   一覧と変え方: docs/infra/runtime-config.md
#   - ここから変数を消しても Cloud Run 側には残る。消す時は 1 回 --remove-env-vars を足すか、
#     gcloud run services update <svc> --remove-env-vars=KEY で消す。
#   - 新しいサービス(初回デプロイ)でも --update-env-vars で作れる(gcloud run deploy は作成と更新の両方)。
# - シークレットは --set-secrets のまま(全置換)。ワークフローから外したシークレットが残り続けないように。
#   手で足したシークレット参照は次のデプロイで消えるので、要るものはここに書く。
name: deploy-cloudrun

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先
        type: choice
        required: true
        default: staging
        options: [staging, production]

# 同じ環境へのデプロイは直列化(古い実行はキャンセルしない: 中途半端な状態を避ける)
concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF に必須

jobs:
  deploy-changes:
    name: deploy-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      environment: ${{ steps.target.outputs.environment }}
      suffix: ${{ steps.target.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 20

      # push では直前のコミット(push 前の HEAD)との差分で判定する
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-cloudrun.yml'

      - id: target
        env:
          INPUT_ENV: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # AUTH_MODE 未設定 = firebase(Admin SDK で ID トークン検証)。Firestore は GOOGLE_CLOUD_PROJECT + FIRESTORE_DATABASE + run-backend SA の ADC。
          if [ -n "$INPUT_ENV" ]; then
            environment="$INPUT_ENV"
          elif [ "$REF_NAME" = "main" ]; then
            environment="production"
          else
            environment="staging"
          fi
          case "$environment" in
            production) suffix="prod" ;;
            *)          suffix="stg" ;;
          esac
          {
            echo "environment=$environment"
            echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
          echo "target: $environment (appconfig-$suffix / ai-$suffix)"

  deploy:
    name: deploy
    needs: deploy-changes
    if: needs.deploy-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # デプロイ ~10 分 + スモーク(staging: Claude 3 回 / production: 2 回・~1 分)
    environment:
      name: ${{ needs.deploy-changes.outputs.environment }}
      url: ${{ steps.appconfig.outputs.url }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUN_SA: run-backend@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      ENV_SUFFIX: ${{ needs.deploy-changes.outputs.suffix }}
      # Firestore の接続先(#290・backend/internal/fsenv)。今は stg / prod とも同じプロジェクトの (default)。
      # APP_ENV=stg が本番の DB を使うと起動を止めるので、分離(#291・#293)までは stg だけ ALLOW_SHARED_PROD_DB=1。
      # 分離したら stg 側を新しい接続先にして ALLOW_SHARED_PROD_DB=0 にする(消すと --update-env-vars では残る)。
      # FIRESTORE_DATABASE はワークフローが毎回決める: gcloud で復元先(#294)に向けても次のデプロイで戻る。
      # 復元先を使い続ける時は GitHub の Environment 変数 FIRESTORE_DATABASE で固定する(docs/infra/runtime-config.md)。
      FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || '(default)' }}
      ALLOW_SHARED_PROD_DB: ${{ needs.deploy-changes.outputs.suffix == 'stg' && '1' || '0' }}
      # App Check(#318・docs/infra/app-check.md)。GitHub の Environment 変数 APP_CHECK_MODE(staging / production 別)で
      # off / log / enforce を切り替える。未設定は off。ワークフローが毎回決める値なので、gcloud で手で変えた値は次のデプロイで戻る
      APP_CHECK_MODE: ${{ vars.APP_CHECK_MODE || 'off' }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/backend/backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # env の組み立てが docs/infra/runtime-config.md の表とずれていたら、ビルド前に止める(#509)
      - name: 環境変数の組み立てを確かめる
        run: scripts/check-deploy-env.sh

      - name: GCP 認証(Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Docker build & push(Artifact Registry)
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -f backend/Dockerfile -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "pushed: $IMAGE"

      - name: Deploy appconfig-${{ env.ENV_SUFFIX }}
        id: appconfig
        run: |
          set -euo pipefail
          gcloud run deploy "appconfig-${ENV_SUFFIX}" \
            --image="$IMAGE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --service-account="$RUN_SA" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=3 \
            --concurrency=80 --timeout=60 \
            --update-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIRESTORE_DATABASE=${FIRESTORE_DATABASE},APP_ENV=${ENV_SUFFIX},ALLOW_SHARED_PROD_DB=${ALLOW_SHARED_PROD_DB},APP_CHECK_MODE=${APP_CHECK_MODE},GIT_SHA=${GITHUB_SHA}" \
            --quiet
          url="$(gcloud run services describe "appconfig-${ENV_SUFFIX}" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "appconfig-${ENV_SUFFIX}: $url"

      - name: Deploy ai-${{ env.ENV_SUFFIX }}
        id: ai
        env:
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
        run: |
          set -euo pipefail
          # 同じイメージを /app/ai で起動。Claude 呼び出しは数十秒かかるので timeout=300
          # APPCONFIG_BASE_URL は cmd/ai/main.go が読む名前(未設定だと ai はインメモリ stub で動き appconfig を叩かない)。
          # ai → appconfig はクライアントの Firebase ID トークンをそのまま転送するので Cloud Run 間の追加認証は不要。
          # env は --update-env-vars(手で入れた RATE_LIMIT_* などを残す)、secret は --set-secrets(全置換)。
          gcloud run deploy "ai-${ENV_SUFFIX}" \
            --image="$IMAGE" \
            --command=/app/ai \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --service-account="$RUN_SA" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=3 \
            --concurrency=20 --timeout=300 \
            --update-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIRESTORE_DATABASE=${FIRESTORE_DATABASE},APP_ENV=${ENV_SUFFIX},ALLOW_SHARED_PROD_DB=${ALLOW_SHARED_PROD_DB},APPCONFIG_BASE_URL=${APPCONFIG_BASE_URL},APP_CHECK_MODE=${APP_CHECK_MODE},GIT_SHA=${GITHUB_SHA}" \
            --set-secrets="ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" \
            --quiet
          url="$(gcloud run services describe "ai-${ENV_SUFFIX}" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ai-${ENV_SUFFIX}: $url"

      # runner(自動の動き・#341)。prod だけ・repo / Environment の変数 RUNNER_DEPLOY=1 の時だけ(既定は飛ばす)。
      # 非公開(--no-allow-unauthenticated): 呼べるのは Scheduler の SA runner-scheduler だけ(infra/runner.tf)。
      # SA runner は infra/runner.tf の runner_enabled = true で作る(無いとここで失敗する)。
      # 1 回の tick は約 50 秒(TickBudget)なので timeout=90。tick はインスタンスごとに 1 本ずつなので最大 2 台で足りる。
      # 運用の値(RUNNER_PAUSED など)は --update-env-vars なので残る(docs/infra/runtime-config.md)。
      # 非公開なので /health は CI から叩かない(gcloud run deploy が Ready になるまで待つ)。
      # APNs(#269): 変数 RUNNER_APNS=1 の時だけ Secret Manager の APNS_AUTH_KEY を注入する(無ければ通知はログだけ)。
      # APNS_KEY_ID / APNS_TEAM_ID / APNS_TOPIC は人が gcloud --update-env-vars で入れる(docs/infra/runner.md)。
      # RUNNER_ACCOUNT_AGE=firestore: 送り手の作成時刻は appconfig が書く users/{uid}.firstSeenAt で読む(#339 の 24 時間。datastore.user で足りる)。
      # firebase(Firebase Auth・SA に roles/firebaseauth.viewer が要る)はコードに残すが使わない(infra/runner.tf)。
      - name: Deploy runner-${{ env.ENV_SUFFIX }}
        id: runner
        if: env.ENV_SUFFIX == 'prod' && vars.RUNNER_DEPLOY == '1'
        env:
          RUNNER_SA: runner@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          RUNNER_APNS: ${{ vars.RUNNER_APNS }}
        run: |
          set -euo pipefail
          secrets="--clear-secrets"
          if [ "${RUNNER_APNS:-}" = "1" ]; then
            secrets="--set-secrets=APNS_AUTH_KEY=APNS_AUTH_KEY:latest"
          fi
          gcloud run deploy "runner-${ENV_SUFFIX}" \
            --image="$IMAGE" \
            --command=/app/runner \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --service-account="$RUNNER_SA" \
            --no-allow-unauthenticated \
            --port=8080 \
            --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=2 \
            --concurrency=10 --timeout=90 \
            --update-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIRESTORE_DATABASE=${FIRESTORE_DATABASE},APP_ENV=${ENV_SUFFIX},ALLOW_SHARED_PROD_DB=${ALLOW_SHARED_PROD_DB},RUNNER_ACCOUNT_AGE=firestore,GIT_SHA=${GITHUB_SHA}" \
            "$secrets" \
            --quiet
          url="$(gcloud run services describe "runner-${ENV_SUFFIX}" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "runner-${ENV_SUFFIX}: $url (private)"

      - name: ヘルスチェック(GET /health が 200)
        env:
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
          AI_URL: ${{ steps.ai.outputs.url }}
        run: |
          set -euo pipefail
          for url in "$APPCONFIG_BASE_URL" "$AI_URL"; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${url}/health"
            echo " <- ${url}/health OK"
          done

      - name: Job summary
        env:
          ENVIRONMENT: ${{ needs.deploy-changes.outputs.environment }}
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
          AI_URL: ${{ steps.ai.outputs.url }}
          RUNNER_URL: ${{ steps.runner.outputs.url }}
        run: |
          {
            echo "## Cloud Run deploy: ${ENVIRONMENT}"
            echo
            echo "| service | URL | health |"
            echo "|---|---|---|"
            echo "| appconfig-${ENV_SUFFIX} | ${APPCONFIG_BASE_URL} | [/health](${APPCONFIG_BASE_URL}/health) 200 |"
            echo "| ai-${ENV_SUFFIX} | ${AI_URL} | [/health](${AI_URL}/health) 200 |"
            if [ -n "$RUNNER_URL" ]; then
              echo "| runner-${ENV_SUFFIX} | ${RUNNER_URL} | 非公開(Ready のみ確認) |"
            else
              echo "| runner | (飛ばした: prod かつ RUNNER_DEPLOY=1 の時だけ) | - |"
            fi
            echo
            echo "image: \`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- スモーク(staging / production・Day2 の保険・非ブロッキング) -----------------
      # デモ発話を実 API で流し、表を job summary に貼る。失敗してもデプロイは成功扱い(continue-on-error)。
      #   staging:    デモ 3 本(家計簿 create → edit → undo / 筋トレ / 散歩)。Claude 3 回(~30 秒)。
      #   production: Claude 費用を抑えるため家計簿 1 本だけ(-only kakeibo・Claude 2 回)。さらに
      #               -cleanup で作った smoke-* アプリを DELETE /v1/apps/{id}(archive)して Firestore に残さない。
      # appconfig は AUTH_MODE=firebase なので dev トークンは通らない → Firebase 匿名ユーザーの
      # ID トークンを identitytoolkit REST で取る。FIREBASE_WEB_API_KEY は repo Variables
      # (Firebase Web API key = クライアント配布される公開情報)。未設定 / 取得失敗なら
      # cmd/smoke が health と「未認証 generate が 401」の確認だけにフォールバックする。
      - uses: actions/setup-go@v7
        if: contains(fromJSON('["staging","production"]'), needs.deploy-changes.outputs.environment)
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/go.mod

      - name: Smoke(${{ needs.deploy-changes.outputs.environment }}・非ブロッキング)
        if: contains(fromJSON('["staging","production"]'), needs.deploy-changes.outputs.environment)
        continue-on-error: true
        working-directory: backend
        env:
          ENVIRONMENT: ${{ needs.deploy-changes.outputs.environment }}
          AI_URL: ${{ steps.ai.outputs.url }}
          APPCONFIG_BASE_URL: ${{ steps.appconfig.outputs.url }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: |
          set -o pipefail
          extra=()
          if [ "$ENVIRONMENT" = "production" ]; then
            extra=(-only kakeibo -cleanup)
          fi
          {
            printf '\n## Smoke(%s)\n\n' "$ENVIRONMENT"
            if [ "$ENVIRONMENT" = "production" ]; then
              echo "家計簿 1 本(create → edit → undo)のみ。作った smoke-* アプリは終了時に archive(-cleanup)。"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/smoke -ai "$AI_URL" -appconfig "$APPCONFIG_BASE_URL" \
            -firebase-api-key "$FIREBASE_WEB_API_KEY" -timeout 120s "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
