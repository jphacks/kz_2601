# 依存更新の自動 PR(週1)。PR は develop 宛て・Conventional Commits の prefix 付き。
# bot はマージできない(ブランチ保護で人間限定)ので、人間が確認して merge する。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, backend]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    target-branch: develop
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, ci]
    open-pull-requests-limit: 5
