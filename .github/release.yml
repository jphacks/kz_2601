# GitHub Release の「Generate release notes」の分類。手順は docs/release/process.md
# PR に付いたラベルで分ける(上から順に最初に当たった分類に入る)。ラベルの無い PR は「その他」。
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: 新機能
      labels:
        - enhancement
    - title: 不具合の修正
      labels:
        - bug
    - title: backend
      labels:
        - backend
    - title: ドキュメント
      labels:
        - documentation
    - title: その他
      labels:
        - "*"
