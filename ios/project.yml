# xcodegen 定義。`cd ios && xcodegen generate` で Metamon.xcodeproj を生成する(.xcodeproj はコミットしない)。
# ホーム画面の表示名(正式名「Tailor It」・#62)は build setting METAMON_DISPLAY_NAME(Info.plist の CFBundleDisplayName に展開)で変える。
# 内部識別子 `Metamon` / Bundle ID `jp.kz2601.metamon` は Firebase に登録済みなので変更しない。
name: Metamon

options:
  bundleIdPrefix: jp.kz2601
  deploymentTarget:
    iOS: "17.0"
    # Mac のネイティブ版(#929・docs/decisions/363-desktop-strategy.md の推奨)
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 構成と接続先(#292・docs/ios/architecture.md「ビルド構成と接続先」):
#   | 構成    | 用途                         | URL  | Firebase plist                     | 表示名        |
#   | Debug   | 開発・CI・UI テスト          | stg  | Staging(無ければ prod に戻す・警告) | Tailor It β   |
#   | Staging | 端末に入れる検証版           | stg  | Staging(無ければ prod に戻す・警告) | Tailor It β   |
#   | Release | 配布(TestFlight / App Store) | prod | prod                               | Tailor It     |
#   | Review  | App Store 審査用(#245)      | prod | prod                               | Tailor It     |
# Review = App Store 審査用(#245・APP_STORE_REVIEW)。
# Review は審査で危ない機能をバイナリから外す。ビルドは必ず scripts/build-review.sh で(ローカル Swift Package にも
# コンパイル条件を渡すため。Xcode の GUI だけで Review をビルドするとコンパイルエラーで止まる=取りこぼし防止)。docs/ios/review-build.md
configs:
  Debug: debug
  Staging: release
  Release: release
  Review: release

settings:
  base:
    # Swift 6 コンパイラ + Swift 5 言語モード。strict concurrency は targeted(警告止まり)でハッカソン速度を優先。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2026103001"
    CODE_SIGN_STYLE: Automatic
    # 実機ビルド時: `METAMON_TEAM_ID=XXXXXXXXXX xcodegen generate` で Team を注入(空なら未設定)
    DEVELOPMENT_TEAM: ${METAMON_TEAM_ID}
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # バックエンド URL(Info.plist の MetamonAIBaseURL / MetamonAppConfigBaseURL に展開)。空=その側はモック/インメモリ。
    # 既定は stg(Debug / Staging)。Release / Review は下の configs で prod に上書きする。ローカルに向けるなら
    #   xcodebuild ... METAMON_AI_BASE_URL=http://127.0.0.1:8081 METAMON_APPCONFIG_BASE_URL=http://127.0.0.1:8080(シミュレータ)。
    # 全モックで起動したい時は実行時の環境変数 METAMON_MOCK=1。
    # stg の URL は今の jphacks-kz2601 の stg Cloud Run。stg 用のプロジェクトを作ったらここを差し替える(#288)。
    METAMON_AI_BASE_URL: "https://ai-stg-378953239426.asia-northeast1.run.app"
    METAMON_APPCONFIG_BASE_URL: "https://appconfig-stg-378953239426.asia-northeast1.run.app"
    # Firebase の plist の選び方(stg / prod)。scripts/select-firebase-plist.sh が読む
    METAMON_FIREBASE_ENV: stg
    # ホーム画面の表示名(Info.plist の CFBundleDisplayName)。stg 系は β を付けて見分ける
    METAMON_DISPLAY_NAME: "Tailor It β"
    # Bundle ID の末尾(本体とウィジェット)。既定は空 = 全構成で jp.kz2601.metamon(署名・App Group・Sign in with Apple を今のまま)。
    # stg 版を prod 版と並べて入れたい時だけ `METAMON_STG_BUNDLE_ID_SUFFIX=.stg xcodegen generate` で Debug / Staging に付ける。
    # 事前に人の作業(App ID・Firebase の iOS アプリ登録)が要る: docs/ios/architecture.md「ビルド構成と接続先」
    METAMON_BUNDLE_ID_SUFFIX: ""
    # 「アップデートしてください」の App Store ボタン(#302・Info.plist MetamonAppStoreURL)。
    # App Store Connect の Apple ID(backend の sharepage.go の AppStoreURL と同じ)。空にすると「Tailor It」の検索を開く
    METAMON_APP_STORE_URL: "https://apps.apple.com/app/id6828742045"
    # App Attest の環境(#318・entitlement com.apple.developer.devicecheck.appattest-environment に展開)。
    # 開発署名で端末に入れる Debug / Staging は development、配布の Release / Review は production。docs/infra/app-check.md
    METAMON_APP_ATTEST_ENV: development
    # プッシュ通知の環境(#683・Metamon.entitlements の aps-environment に展開)。Debug / Staging は development(APNs sandbox)、
    # Release は production。Review は通知を外しているので Metamon-Review.entitlements に入れない。docs/infra/runtime-config.md
    METAMON_APS_ENV: development
    # Universal Links のドメイン(#331・Metamon.entitlements の applinks:<ここ> に展開)。シェアリンク https://tailor-it.app/s/<token> をアプリで開く。
    # 全構成で同じ(AASA は Apple の CDN 経由で取るので開発署名でも効く)。Review は共有リンクを外しているので Metamon-Review.entitlements に入れない。
    # アプリ側の判定は ShareURL.webHost と揃える。docs/infra/universal-links/README.md
    METAMON_APPLINKS_DOMAIN: tailor-it.app
  configs:
    Debug:
      METAMON_BUNDLE_ID_SUFFIX: "${METAMON_STG_BUNDLE_ID_SUFFIX}"
    Staging:
      METAMON_BUNDLE_ID_SUFFIX: "${METAMON_STG_BUNDLE_ID_SUFFIX}"
    # 配布用は prod。URL の出典: docs/release/2026-10-25-runbook.md「prod の URL」・backend/Makefile
    Release:
      METAMON_AI_BASE_URL: "https://ai-prod-378953239426.asia-northeast1.run.app"
      METAMON_APPCONFIG_BASE_URL: "https://appconfig-prod-378953239426.asia-northeast1.run.app"
      METAMON_FIREBASE_ENV: prod
      METAMON_DISPLAY_NAME: "Tailor It"
      METAMON_APP_ATTEST_ENV: production
      METAMON_APS_ENV: production
    Review:
      METAMON_AI_BASE_URL: "https://ai-prod-378953239426.asia-northeast1.run.app"
      METAMON_APPCONFIG_BASE_URL: "https://appconfig-prod-378953239426.asia-northeast1.run.app"
      METAMON_FIREBASE_ENV: prod
      METAMON_DISPLAY_NAME: "Tailor It"
      METAMON_APP_ATTEST_ENV: production

# ---- ローカル Swift Package(マルチモジュール。依存の向きは各 Package.swift で固定) ----
#   MetamonDSL      : DSL モデル・グリッド計算・集計(Foundation のみ。macOS で `swift test` 可)
#   MetamonRenderer : SwiftUI View(コンポーネント1種=1ファイル + ComponentRegistry)。Services を知らない
#   MetamonServices : Services protocol 群 + 実装(HTTP/Mock/WhisperKit/Firebase Auth/通知)。
#                     WhisperKit(argmax-oss-swift 1.1.1)と firebase-ios-sdk(FirebaseAuth + FirebaseCrashlytics・13.1.1 固定)はこのパッケージの依存
packages:
  MetamonDSL:
    path: Packages/MetamonDSL
  MetamonRenderer:
    path: Packages/MetamonRenderer
  MetamonServices:
    path: Packages/MetamonServices
# Firebase: `ios/scripts/sync-firebase-plist.sh` で GoogleService-Info.plist(prod)と、あれば GoogleService-Info-Staging.plist(stg)を
# ios/Firebase/ にコピーする(.gitignore 済み・コミット禁止)。バンドルへは Metamon ターゲットのビルドフェーズ
# 「Select Firebase plist」が構成に合う方を GoogleService-Info.plist として入れる。無くてもビルド/起動はでき、認証はモック(固定 uid)になる。

targets:
  Metamon:
    type: application
    platform: iOS
    sources:
      - path: Metamon
        # 古い置き場(Metamon/Resources)に残った plist をリソースとして二重に入れない。バンドルへはビルドフェーズが入れる(#292)
        excludes:
          - "**/GoogleService-Info*.plist"
      # ウィジェットと共有する受け渡しモデル(WidgetSnapshot)。両ターゲットにコンパイルする
      - path: MetamonWidget/Shared
      # Mac と共有するランタイムの部品(UIKit に依存しない: 遷移・確認・保存/削除の前段・文言)。#939
      # Brand.xcassets(アクセント色・ツルの絵)もここ(#935)
      - path: Shared
      # DSL v1 の正典サンプル(docs/dsl/examples/*.json)をそのままバンドル。iOS 側にコピーを持たない(ドリフト防止)。
      - path: ../docs/dsl/examples
        buildPhase: resources
        type: group
      # プライバシーポリシー・利用規約(#246)。アプリ内で同梱版を表示し、その画面から公開ページ(tailor-it.app)も開ける
      - path: ../docs/legal
        buildPhase: resources
        type: group
        includes: ["privacy-policy.md", "terms.md"]
    dependencies:
      - package: MetamonDSL
      - package: MetamonRenderer
      - package: MetamonServices
      # ホーム画面ウィジェット(埋め込み)
      - target: MetamonWidget
    # Sign in with Apple + App Group(ウィジェットとの共有)。自動署名(-allowProvisioningUpdates)が App ID に capability を付与する(有料 Developer Program 必須)。
    # 中身: Sign in with Apple / App Group / HealthKit(healthStat / Field.health・#167。自動署名で App ID に HealthKit が付く)/
    # App Attest(App Check・#318。環境は METAMON_APP_ATTEST_ENV。自動署名で App ID に App Attest が付く)/
    # Push(aps-environment・#683。環境は METAMON_APS_ENV。自動署名で App ID に Push Notifications が付く)/
    # Associated Domains(Universal Links・#331。applinks:$(METAMON_APPLINKS_DOMAIN)。自動署名で App ID に Associated Domains が付く)。
    # 構成ごとに別ファイルにするため xcodegen の `entitlements:` ではなく CODE_SIGN_ENTITLEMENTS で指定する(#245)。
    # Review(審査用)は HealthKit・Push・Associated Domains を外した Metamon/Metamon-Review.entitlements。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon$(METAMON_BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: Metamon
        INFOPLIST_FILE: Metamon/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Metamon/Metamon.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # 選べるアプリアイコン(#232)。名前は Assets.xcassets の AppIcon-*.appiconset と AppIconOption.all(Features/Settings/AppIconPicker.swift)に揃える。
        # actool が Info.plist に CFBundleAlternateIcons を書く。絵の差し替え方: docs/ios/alternate-icons.md
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Dark AppIcon-Light AppIcon-Mono"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        # 下の select-firebase-plist.sh が「あれば使う」plist(ios/Firebase/ の stg 版)を読むため。
        # サンドボックスは宣言した入力ファイルしか読めず、無いかもしれないファイルは入力に書けない(書くと無い時にビルドが落ちる・#292)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # 開発用メニュー(#2079): stg の版(Debug / Staging)だけ METAMON_STG。Release・Review には足さない(コードごと入らない)
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) METAMON_STG"
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) METAMON_STG"
        # dSYM を Crashlytics へ送るスクリプト(#296)がサンドボックスの外(SourcePackages・ネット)を使うため
        Release:
          ENABLE_USER_SCRIPT_SANDBOXING: NO
        # App Store 審査用(#245): コード・部品の登録・権限の説明・entitlement(HealthKit)を外す
        Review:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE_REVIEW"
          CODE_SIGN_ENTITLEMENTS: Metamon/Metamon-Review.entitlements
          METAMON_APP_STORE_REVIEW: "YES"
          # 審査用の版の接続先は prod(#452 G7)。URL と plist は上の project の configs(Review)で prod にしている
    postBuildScripts:
      # 構成に合う Firebase plist をバンドルに GoogleService-Info.plist として入れる(#292)。
      # Debug / Staging は Staging の plist、無ければ prod の plist に戻して警告。Release / Review は prod。
      - name: Select Firebase plist
        script: '"${SRCROOT}/scripts/select-firebase-plist.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/select-firebase-plist.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
      # Review 構成だけ Info.plist から外した機能の権限の説明を消す(Debug / Release では何もしない・#245)
      - name: Strip review-only Info.plist keys
        script: '"${SRCROOT}/scripts/strip-review-plist.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/strip-review-plist.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
      # 通常の版(Debug / Staging / Release)だけ、マニフェストに通常の版で集める種類を足す(Review は元のまま)。
      # 足す種類は docs/store/privacy-label.md の 4 章と 1 対 1
      - name: Extend privacy manifest for normal builds
        script: '"${SRCROOT}/scripts/extend-privacy-manifest.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/extend-privacy-manifest.sh
        basedOnDependencyAnalysis: false
      # クラッシュ報告(#296): dSYM を Crashlytics へ。実機向けの Release / Review だけ送る(Debug・シミュレータは即終了)。
      # docs/ios/crash-reporting.md。Crashlytics の run は SourcePackages・dSYM を読みネットに出るので、Release / Review はサンドボックスを外している(上の configs)。
      # 入力に dSYM・plist を並べないのは、Debug(dSYM を作らない)や plist 無しの CI で「入力が無い」と止まらないようにするため
      - name: Upload dSYM to Crashlytics
        script: '"${SRCROOT}/scripts/crashlytics-dsym.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/crashlytics-dsym.sh
        basedOnDependencyAnalysis: false
    scheme:
      # 各モジュールのユニットテストを `xcodebuild -scheme Metamon test` で一括実行する。
      testTargets:
        - package: MetamonDSL/MetamonDSLTests
        - package: MetamonRenderer/MetamonRendererTests
        - package: MetamonServices/MetamonServicesTests
        # アプリをホストにしたテスト(StoreKitTest の購入など、Bundle ID が要るもの・#77)
        - MetamonTests
        # ウィジェットの見た目の描画テスト(#486)
        - MetamonWidgetTests
        # 指の操作(タップ・ドラッグ・長押し)の UI テスト(#165)。手元で回す: docs/ios/architecture.md「UI テスト」
        - name: MetamonUITests
          parallelizable: false
      gatherCoverageData: false
      # 課金(#77): Run 時の StoreKit をローカル構成ファイルにする(シミュレータでテスト購入できる・外部アカウント不要)。
      # 本番(TestFlight / App Store)では使われない。商品 ID の正典は MetamonServices/Purchase/ProProducts.swift
      storeKitConfiguration: StoreKit/TailorItPro.storekit

  # アプリをホストにしたユニットテスト(#77: SKTestSession は Bundle ID を持つホストが無いと商品が取れない)。
  MetamonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MetamonTests
      # アプリの Scheme と同じ構成ファイルをテストバンドルにも入れる(SKTestSession(configurationFileNamed:) で読む)
      - path: StoreKit/TailorItPro.storekit
        buildPhase: resources
    dependencies:
      - target: Metamon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.tests
        TARGETED_DEVICE_FAMILY: "1"
      # アプリと同じく stg の版だけ METAMON_STG(開発用メニューのテストを #if METAMON_STG で包む・#2079)
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) METAMON_STG"
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) METAMON_STG"

  # ホーム画面ウィジェット(WidgetKit)。本体が App Group に書いた集計済みスナップショットを描画するだけ(Renderer/DSL 非依存)。
  # Bundle ID は本体の子(jp.kz2601.metamon.widget)。実機は App ID 2 つ + App Group を自動署名が作る(§docs/ios/architecture.md ウィジェット)。
  MetamonWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MetamonWidget
      # コントロール(iOS 18・#1993)を押した時の Intent。本体にも同じ型があると、OS が本体を開いて本体のプロセスで動かす
      - path: Metamon/Features/Intents/ControlIntents.swift
    entitlements:
      path: MetamonWidget/MetamonWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.jp.kz2601.metamon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon$(METAMON_BUNDLE_ID_SUFFIX).widget
        PRODUCT_NAME: MetamonWidget
        INFOPLIST_FILE: MetamonWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES

  # ウィジェットの描画テスト(#486)。ウィジェットの View(MetamonWidget/Views)と受け渡しモデルを直接コンパイルし、ImageRenderer で描く。
  # 環境変数 WIDGET_SHOTS_DIR(xcodebuild では TEST_RUNNER_WIDGET_SHOTS_DIR)があれば PNG を書き出す(PR のスクショ用)。
  MetamonWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MetamonWidgetTests
      - path: MetamonWidget/Views
      - path: MetamonWidget/Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.widgettests
        TARGETED_DEVICE_FAMILY: "1"

  # UI テスト(XCUITest・#165)。モック(METAMON_MOCK=1)+ DEBUG フックで起動し、FAB のドラッグ / 長押し・チップ・チェック丸・フォームを実際に指で操作する。
  MetamonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MetamonUITests
    dependencies:
      - target: Metamon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Metamon
        TARGETED_DEVICE_FAMILY: "1"

  # Mac のネイティブ版(#929・docs/decisions/363-desktop-strategy.md)。3 つのパッケージを iOS と共有し、殻は ios/MetamonMac/。
  # Bundle ID は iOS と同じ(ユニバーサル購入)。署名は project の base の自動署名・DEVELOPMENT_TEAM(METAMON_TEAM_ID)をそのまま使う。
  # Apple シリコンと Intel の両方(ARCHS_STANDARD = arm64 + x86_64。Debug は ONLY_ACTIVE_ARCH で手元の CPU だけ)。
  # 同梱の DSL 例を中央で動かす(記録はメモリ上・#939)。画面の骨格は #933、権限の説明は #931(マイク・音声認識は #966)。
  # Firebase(#930): ログイン(匿名・Sign in with Apple)・AI・フィードバック・App Check(DeviceCheck)・Crashlytics。plist が無ければモック(MacServices)。
  # プッシュ(#982): 通常の版だけ APNs の端末を登録する(MacPushHost・entitlement は com.apple.developer.aps-environment = METAMON_APS_ENV)。
  MetamonMac:
    type: application
    platform: macOS
    sources:
      - path: MetamonMac
      # iOS の AppRuntime と共有する部品(遷移・確認・保存/削除の前段・文言)。#939
      # Brand.xcassets(アクセント色・ツルの絵)も iOS と共有する(#935)
      # 「直してと頼む」の依頼文(Runtime/FixRequest.swift)と起動時の画面の順番(Runtime/LaunchConsentHold.swift)も iOS と共有する(#1885)
      - path: Shared
      # 本体のデザイントークンとツルは iOS のファイルをそのまま使う(#935)
      - path: Metamon/App/Theme.swift
      - path: Metamon/App/CraneMascot.swift
      # 設定の「ライセンス」は iOS と同じ一覧を同梱する(#973)
      - path: Metamon/Resources/ThirdPartyLicenses.json
        buildPhase: resources
      # 作る・直す会話(#967): 組み上げの演出・生成中の段階の文言・頼み方のコツは iOS のファイルをそのまま使う
      - path: Metamon/Features/Voice/BuildChoreography.swift
      - path: Metamon/Features/Voice/BuildStageView.swift
      - path: Metamon/Features/Voice/GeneratingStage.swift
      - path: Metamon/Features/Tips/PromptTips.swift
      # エラーの状態カード(#968): 失敗の分け方と文言は iOS のファイルをそのまま使う(見た目の ErrorCard は iOS だけ)
      - path: Metamon/Features/Voice/ErrorCopy.swift
      - path: Metamon/Features/Voice/ErrorPresentation.swift
      # 持てるアプリの数(#630)の状態カードの文言と置き換えの中身は iOS と共有する
      - path: Metamon/Features/AppLimit/AppLimitCopy.swift
      - path: Metamon/Features/AppLimit/AppReplacePlan.swift
      # 設定の「今日の残り」「使っている量」(#1219)は iOS の文言と出し分けをそのまま使う(Pro かどうかは Mac の `RemainingTodayPlan`)
      - path: Metamon/Features/Settings/RemainingTodaySettingsSection.swift
      - path: Metamon/Features/Usage/UsageCopy.swift
      - path: Metamon/Features/Voice/RemainingTodayDisplay.swift
      # ログイン(#930): サインインの状態(Firebase Auth の観測・Sign in with Apple の受け渡し・nonce)は iOS のファイルをそのまま使う
      - path: Metamon/Features/Auth/AuthSession.swift
      # 共有のリンク(#1287): 参加できない理由(403)の文言は iOS のファイルをそのまま使う
      - path: Metamon/Features/Share/SharedAccessCopy.swift
      # 「探す」(#2069): カード・部品のアイコン・並び順・文言は iOS のファイルをそのまま使う(画面と検索の状態は MacDiscoverView)
      - path: Metamon/Features/Share/PublicAppCard.swift
      # 「みんなに公開」(#2070): 公開前の注意・タグの区切り・表示できない言葉の文言は iOS のファイルをそのまま使う
      - path: Metamon/Features/Share/PublishCopy.swift
      # 設定の「つないだサービス」(#1714): 一覧の並べ方・戻り先の読み方・つなぐ / 切るの状態は iOS のファイルをそのまま使う
      - path: Metamon/Features/Connections/ConnectedServices.swift
      # フィードバックの「直ったら知らせてほしい」(#364): 許可の聞き方と同意の保存は iOS のファイルをそのまま使う(push の登録だけ MacPushHost)
      - path: Metamon/Features/Notices/FeedbackFixedOptIn.swift
      # 近くの人に送る(#964): MultipeerConnectivity の通信は iOS のファイルをそのまま使う(iPhone・iPad と送り合える)。
      # すれ違い通信(passby)は NearbyInteraction・持ち歩く前提なので Mac には入れない(「この Mac では使えません」)
      - path: Metamon/Features/Nearby/NearbyService.swift
      # ショートカット・Siri・Spotlight(App Intents・#1034): Intent の型・Query・フレーズは iOS のファイルをそのまま使う。
      # 本体との橋渡し(IntentHost)だけ Mac 用(MetamonMac/App/Intents/MacIntentHost.swift)。iOS の IntentHost.swift は AppRuntime を使うので入れない
      - path: Metamon/Features/Intents/TailorItIntents.swift
      - path: Metamon/Features/Intents/IntentEntities.swift
      - path: Metamon/Features/Intents/IntentE2E.swift
      - path: Metamon/Resources/AppShortcuts.xcstrings
        buildPhase: resources
      # 規約・ポリシーは iOS と同じ同梱版をアプリ内で読む(#971)
      - path: ../docs/legal
        buildPhase: resources
        type: group
        includes: ["privacy-policy.md", "terms.md"]
      # iOS と同じ DSL 例をそのままバンドル(コピーを持たない)
      - path: ../docs/dsl/examples
        buildPhase: resources
        type: group
      # Mac のウィジェット(#984): 受け渡しモデルと集計は iOS のファイルをそのまま使う(TailorActivityAttributes は iOS だけ)。
      # 押した時の URL(tailorit://widget?app=…)はウィジェットと共有
      - path: MetamonWidget/Shared/WidgetSnapshot.swift
      - path: Metamon/App/WidgetSnapshotWriter.swift
      - path: MetamonMacWidget/Shared
    dependencies:
      - package: MetamonDSL
      - package: MetamonRenderer
      - package: MetamonServices
      # デスクトップ・通知センターのウィジェット(埋め込み・#984)
      - target: MetamonMacWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon$(METAMON_BUNDLE_ID_SUFFIX)
        # Finder・Dock・アクティビティモニタに出るバンドル名(#1054)。Bundle ID は変えない(Keychain・UserDefaults を引き継ぐ)。
        # Swift のモジュール名は Metamon のまま固定する(`@testable import Metamon`・型の名前が変わらないように)
        PRODUCT_NAME: Tailor It
        PRODUCT_MODULE_NAME: Metamon
        INFOPLIST_FILE: MetamonMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MetamonMac/MetamonMac.entitlements
        ARCHS: $(ARCHS_STANDARD)
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        # Mac 用のアイコン(16〜512pt・1x/2x。iOS の絵を macOS の角丸の枠に入れたもの・#1052)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ブランドの藍をアクセントに(システム設定のアクセントが「マルチカラー」の時だけ効く・#935)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # select-firebase-plist.sh が「あれば使う」plist を読むため(iOS と同じ理由・#292)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # 通常の版だけマニフェストに足す種類(#931)。Mac もプッシュの端末を登録する(#982)ので iOS と同じ既定(デバイス ID 込み)を使う
      configs:
        # 開発用メニュー(#2079): stg の版(Debug / Staging)だけ METAMON_STG。Release・Review には足さない(コードごと入らない)
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) METAMON_STG"
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) METAMON_STG"
        Review:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE_REVIEW"
          METAMON_APP_STORE_REVIEW: "YES"
          # 共有のリンクとプッシュを外した版なので Associated Domains(#1286)と aps-environment(#982)を入れない(iOS の Metamon-Review.entitlements と同じ)
          CODE_SIGN_ENTITLEMENTS: MetamonMac/MetamonMac-Review.entitlements
    postBuildScripts:
      # iOS と同じスクリプト・同じ plist(Bundle ID が iOS と同じなので、Firebase の Apple アプリ 1 つを Mac でも使う・#930)。
      # ios/Firebase/ に plist が無ければ何も入れない(秘密のファイルは repo に無い)。無い時はログインと AI がモックになる(MacServices)
      - name: Select Firebase plist
        script: '"${SRCROOT}/scripts/select-firebase-plist.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/select-firebase-plist.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
      # 通常の版(Debug / Staging / Release)だけ、マニフェストに通常の版で集める種類を足す(#931・iOS と同じスクリプト)。
      # 元の MetamonMac/PrivacyInfo.xcprivacy は審査用の版の申告のまま
      - name: Extend privacy manifest for normal builds
        script: '"${SRCROOT}/scripts/extend-privacy-manifest.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/extend-privacy-manifest.sh
        basedOnDependencyAnalysis: false
      # クラッシュ報告(#930): dSYM を Crashlytics へ。iOS と同じスクリプト(Release / Review だけ送る。Debug・Staging・plist 無しの CI は即終了)。
      # Mac は base でサンドボックスを外している(上の ENABLE_USER_SCRIPT_SANDBOXING)。docs/ios/crash-reporting.md
      - name: Upload dSYM to Crashlytics
        script: '"${SRCROOT}/scripts/crashlytics-dsym.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/crashlytics-dsym.sh
        basedOnDependencyAnalysis: false
    scheme:
      # Mac の単体テスト(#1212)。`xcodebuild -scheme MetamonMac test`(mac-ci の mac-build-test でも回す)
      testTargets:
        - MetamonMacTests
        # キーボード操作の UI テスト(#1140)。既定では回さない(CI の時間を増やさない)。手元で回す: -only-testing:MetamonMacUITests
        - name: MetamonMacUITests
          skipped: true
          parallelizable: false
      gatherCoverageData: false
      # 課金: iOS と同じローカルの StoreKit の構成で Run 時にテスト購入できる(本番では使われない)
      storeKitConfiguration: StoreKit/TailorItPro.storekit

  # Mac のウィジェット(WidgetKit・#984)。デスクトップと通知センターに小・中・大。iOS の MetamonWidget と同じく、本体が App Group に書いた
  # WidgetSnapshot を描くだけ(Renderer/DSL 非依存)。見た目は iOS の Views を共有(AccessoryViews は Mac に無いので入れない)。
  # Bundle ID は iOS のウィジェットと同じ(本体が iOS と同じ ID なので、その子を揃える)。App Group も iOS と同じ名前。
  MetamonMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: MetamonMacWidget
      - path: MetamonWidget/Shared/WidgetSnapshot.swift
      - path: MetamonWidget/Views/StatViews.swift
      - path: MetamonWidget/Views/LargeStatsView.swift
      - path: MetamonWidget/Localizable.xcstrings
      - path: MetamonWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon$(METAMON_BUNDLE_ID_SUFFIX).widget
        PRODUCT_NAME: MetamonMacWidget
        INFOPLIST_FILE: MetamonMacWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MetamonMacWidget/MetamonMacWidget.entitlements
        ARCHS: $(ARCHS_STANDARD)
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
      configs:
        Review:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE_REVIEW"

  # Mac アプリをホストにした単体テスト(#1212)。MacAppRuntime(画面の移動・一言・同期の知らせ)と Mac だけが使う共有の部品
  MetamonMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MetamonMacTests
        # スナップショットの参照の PNG(#1136)はテストがソースの場所から読む。バンドルには入れない
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - target: MetamonMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.mactests
        # アプリの PRODUCT_NAME は Tailor It(ターゲット名と違う・#1054)ので、ホストの場所を書く
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tailor It.app/Contents/MacOS/Tailor It
        BUNDLE_LOADER: $(TEST_HOST)

  # Mac のキーボード操作の UI テスト(XCUITest・#1140)。モック(METAMON_MOCK=1)で起動し、⌘1 / ⌘2・Return・Esc・⌘[・⌘Z をキーだけで通す。
  # scheme では skipped(CI の `xcodebuild test -scheme MetamonMac` では回らない)。手元で回す方法は MetamonMacUITests/KeyboardShellUITests.swift の頭
  MetamonMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MetamonMacUITests
    dependencies:
      - target: MetamonMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.macuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MetamonMac

schemes:
  # Mac の検証版・審査用(#929)。iOS の Metamon-Staging / Metamon-Review と同じ形
  MetamonMac-Staging:
    build:
      targets:
        MetamonMac: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
  MetamonMac-Review:
    build:
      targets:
        MetamonMac: all
    run:
      config: Review
    profile:
      config: Review
    analyze:
      config: Review
    archive:
      config: Review
  # App Store 審査用の scheme(#245)。Run / Archive とも Review 構成。テストは通常の scheme `Metamon` で回す。
  Metamon-Review:
    build:
      targets:
        Metamon: all
    run:
      config: Review
    profile:
      config: Review
    analyze:
      config: Review
    archive:
      config: Review
  # 検証版(stg)を端末に入れる scheme(#292)。Run / Archive とも Staging 構成。テストは通常の scheme `Metamon`(Debug)で回す。
  Metamon-Staging:
    build:
      targets:
        Metamon: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
