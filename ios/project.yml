# xcodegen 定義。`cd ios && xcodegen generate` で Metamon.xcodeproj を生成する(.xcodeproj はコミットしない)。
# ホーム画面の表示名(正式名「Tailor It」・#62)は Metamon/Resources/Info.plist の CFBundleDisplayName だけで変えられる。
# 内部識別子 `Metamon` / Bundle ID `jp.kz2601.metamon` は Firebase に登録済みなので変更しない。
name: Metamon

options:
  bundleIdPrefix: jp.kz2601
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 構成: Debug / Release は今まで通り(全機能)。Review = App Store 審査用(#245・APP_STORE_REVIEW)。
# Review は審査で危ない機能をバイナリから外す。ビルドは必ず scripts/build-review.sh で(ローカル Swift Package にも
# コンパイル条件を渡すため。Xcode の GUI だけで Review をビルドするとコンパイルエラーで止まる=取りこぼし防止)。docs/ios/review-build.md
configs:
  Debug: debug
  Release: release
  Review: release

settings:
  base:
    # Swift 6 コンパイラ + Swift 5 言語モード。strict concurrency は targeted(警告止まり)でハッカソン速度を優先。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 実機ビルド時: `METAMON_TEAM_ID=XXXXXXXXXX xcodegen generate` で Team を注入(空なら未設定)
    DEVELOPMENT_TEAM: ${METAMON_TEAM_ID}
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # バックエンド URL(Info.plist の MetamonAIBaseURL / MetamonAppConfigBaseURL に展開)。空=その側はモック/インメモリ。
    # 既定は ai / appconfig とも staging(Cloud Run)。ローカルに向けるなら
    #   xcodebuild ... METAMON_AI_BASE_URL=http://127.0.0.1:8081 METAMON_APPCONFIG_BASE_URL=http://127.0.0.1:8080(シミュレータ)。
    # 全モックで起動したい時は実行時の環境変数 METAMON_MOCK=1。
    METAMON_AI_BASE_URL: "https://ai-stg-378953239426.asia-northeast1.run.app"
    METAMON_APPCONFIG_BASE_URL: "https://appconfig-stg-378953239426.asia-northeast1.run.app"

# ---- ローカル Swift Package(マルチモジュール。依存の向きは各 Package.swift で固定) ----
#   MetamonDSL      : DSL モデル・グリッド計算・集計(Foundation のみ。macOS で `swift test` 可)
#   MetamonRenderer : SwiftUI View(コンポーネント1種=1ファイル + ComponentRegistry)。Services を知らない
#   MetamonServices : Services protocol 群 + 実装(HTTP/Mock/WhisperKit/Firebase Auth/通知)。
#                     WhisperKit(argmax-oss-swift 1.1.1)と firebase-ios-sdk(FirebaseAuth + FirebaseCrashlytics・13.1.1 固定)はこのパッケージの依存
packages:
  MetamonDSL:
    path: Packages/MetamonDSL
  MetamonRenderer:
    path: Packages/MetamonRenderer
  MetamonServices:
    path: Packages/MetamonServices
# Firebase: `ios/scripts/sync-firebase-plist.sh` で GoogleService-Info.plist を Metamon/Resources/ にコピーしてから generate する
# (.gitignore 済み・コミット禁止)。無くてもビルド/起動はでき、認証はモック(固定 uid)になる。

targets:
  Metamon:
    type: application
    platform: iOS
    sources:
      - path: Metamon
      # ウィジェットと共有する受け渡しモデル(WidgetSnapshot)。両ターゲットにコンパイルする
      - path: MetamonWidget/Shared
      # DSL v1 の正典サンプル(docs/dsl/examples/*.json)をそのままバンドル。iOS 側にコピーを持たない(ドリフト防止)。
      - path: ../docs/dsl/examples
        buildPhase: resources
        type: group
      # プライバシーポリシー・利用規約(#246)。公開 URL が決まるまでアプリ内で同梱版を表示する
      - path: ../docs/legal
        buildPhase: resources
        type: group
        includes: ["privacy-policy.md", "terms.md"]
    dependencies:
      - package: MetamonDSL
      - package: MetamonRenderer
      - package: MetamonServices
      # ホーム画面ウィジェット(埋め込み)
      - target: MetamonWidget
    # Sign in with Apple + App Group(ウィジェットとの共有)。自動署名(-allowProvisioningUpdates)が App ID に capability を付与する(有料 Developer Program 必須)。
    # 中身: Sign in with Apple / App Group / HealthKit(healthStat / Field.health・#167。自動署名で App ID に HealthKit が付く)。
    # 構成ごとに別ファイルにするため xcodegen の `entitlements:` ではなく CODE_SIGN_ENTITLEMENTS で指定する(#245)。
    # Review(審査用)は HealthKit を外した Metamon/Metamon-Review.entitlements。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon
        PRODUCT_NAME: Metamon
        INFOPLIST_FILE: Metamon/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Metamon/Metamon.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # dSYM を Crashlytics へ送るスクリプト(#296)がサンドボックスの外(SourcePackages・ネット)を使うため
        Release:
          ENABLE_USER_SCRIPT_SANDBOXING: NO
        # App Store 審査用(#245): コード・部品の登録・権限の説明・entitlement(HealthKit)を外す
        Review:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE_REVIEW"
          CODE_SIGN_ENTITLEMENTS: Metamon/Metamon-Review.entitlements
          METAMON_APP_STORE_REVIEW: "YES"
          # 審査用の版の接続先は prod(#452 G7)。Debug / Release の既定(上の base の stg)は変えない。
          # URL の出典: docs/release/2026-10-25-runbook.md「prod の URL」・backend/Makefile
          METAMON_AI_BASE_URL: "https://ai-prod-378953239426.asia-northeast1.run.app"
          METAMON_APPCONFIG_BASE_URL: "https://appconfig-prod-378953239426.asia-northeast1.run.app"
          # 下の strip-review-plist.sh が出来上がった Info.plist を書き換えるため(Review だけ)
          ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Review 構成だけ Info.plist から外した機能の権限の説明を消す(Debug / Release では何もしない・#245)
      - name: Strip review-only Info.plist keys
        script: '"${SRCROOT}/scripts/strip-review-plist.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/strip-review-plist.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
      # クラッシュ報告(#296): dSYM を Crashlytics へ。実機向けの Release / Review だけ送る(Debug・シミュレータは即終了)。
      # docs/ios/crash-reporting.md。Crashlytics の run は SourcePackages・dSYM を読みネットに出るので、Release / Review はサンドボックスを外している(上の configs)。
      # 入力に dSYM・plist を並べないのは、Debug(dSYM を作らない)や plist 無しの CI で「入力が無い」と止まらないようにするため
      - name: Upload dSYM to Crashlytics
        script: '"${SRCROOT}/scripts/crashlytics-dsym.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/crashlytics-dsym.sh
        basedOnDependencyAnalysis: false
    scheme:
      # 各モジュールのユニットテストを `xcodebuild -scheme Metamon test` で一括実行する。
      testTargets:
        - package: MetamonDSL/MetamonDSLTests
        - package: MetamonRenderer/MetamonRendererTests
        - package: MetamonServices/MetamonServicesTests
        # アプリをホストにしたテスト(StoreKitTest の購入など、Bundle ID が要るもの・#77)
        - MetamonTests
        # 指の操作(タップ・ドラッグ・長押し)の UI テスト(#165)。手元で回す: docs/ios/architecture.md「UI テスト」
        - name: MetamonUITests
          parallelizable: false
      gatherCoverageData: false
      # 課金(#77): Run 時の StoreKit をローカル構成ファイルにする(シミュレータでテスト購入できる・外部アカウント不要)。
      # 本番(TestFlight / App Store)では使われない。商品 ID の正典は MetamonServices/Purchase/ProProducts.swift
      storeKitConfiguration: StoreKit/TailorItPro.storekit

  # アプリをホストにしたユニットテスト(#77: SKTestSession は Bundle ID を持つホストが無いと商品が取れない)。
  MetamonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MetamonTests
      # アプリの Scheme と同じ構成ファイルをテストバンドルにも入れる(SKTestSession(configurationFileNamed:) で読む)
      - path: StoreKit/TailorItPro.storekit
        buildPhase: resources
    dependencies:
      - target: Metamon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.tests
        TARGETED_DEVICE_FAMILY: "1"

  # ホーム画面ウィジェット(WidgetKit)。本体が App Group に書いた集計済みスナップショットを描画するだけ(Renderer/DSL 非依存)。
  # Bundle ID は本体の子(jp.kz2601.metamon.widget)。実機は App ID 2 つ + App Group を自動署名が作る(§docs/ios/architecture.md ウィジェット)。
  MetamonWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MetamonWidget
    entitlements:
      path: MetamonWidget/MetamonWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.jp.kz2601.metamon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.widget
        PRODUCT_NAME: MetamonWidget
        INFOPLIST_FILE: MetamonWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES

  # UI テスト(XCUITest・#165)。モック(METAMON_MOCK=1)+ DEBUG フックで起動し、FAB のドラッグ / 長押し・チップ・チェック丸・フォームを実際に指で操作する。
  MetamonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MetamonUITests
    dependencies:
      - target: Metamon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.metamon.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Metamon
        TARGETED_DEVICE_FAMILY: "1"

# App Store 審査用の scheme(#245)。Run / Archive とも Review 構成。テストは通常の scheme `Metamon` で回す。
schemes:
  Metamon-Review:
    build:
      targets:
        Metamon: all
    run:
      config: Review
    profile:
      config: Review
    analyze:
      config: Review
    archive:
      config: Review
