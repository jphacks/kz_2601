# xcodegen 定義。`cd ios && xcodegen generate` で Morph.xcodeproj を生成する(.xcodeproj はコミットしない)。
# アプリ名を変える時: このファイルの `Morph` を一括置換 + ディレクトリ `Morph/`, `MorphTests/` をリネーム。
name: Morph

options:
  bundleIdPrefix: jp.kz2601
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Swift 6 コンパイラ + Swift 5 言語モード。strict concurrency は targeted(警告止まり)でハッカソン速度を優先。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 実機ビルド時: `MORPH_TEAM_ID=XXXXXXXXXX xcodegen generate` で Team を注入(空なら未設定)
    DEVELOPMENT_TEAM: ${MORPH_TEAM_ID}
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# ---- 外部パッケージ(まだ追加しない。導入時にコメントを外す) ----
# packages:
#   WhisperKit:
#     url: https://github.com/argmaxinc/WhisperKit
#     from: "0.9.0"
#   Firebase:
#     url: https://github.com/firebase/firebase-ios-sdk
#     from: "11.0.0"
# 導入手順:
#   1. 上の packages を有効化し、targets.Morph.dependencies に
#        - package: WhisperKit
#        - package: Firebase
#          product: FirebaseAuth
#      を追加(Firestore 直読みするなら product: FirebaseFirestore も)。
#   2. Firebase Console から GoogleService-Info.plist を取得し ios/Morph/Resources/ に置く(.gitignore 済み・コミット禁止)。
#   3. Sign in with Apple: targets.Morph.entitlements に com.apple.developer.applesignin: [Default] を追加(有料 Developer Program 必須)。
#   4. `xcodegen generate` → 初回は SwiftPM 解決で数分かかる。

targets:
  Morph:
    type: application
    platform: iOS
    sources:
      - path: Morph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.morph
        PRODUCT_NAME: Morph
        INFOPLIST_FILE: Morph/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - MorphTests
      gatherCoverageData: false

  MorphTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MorphTests
    dependencies:
      - target: Morph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kz2601.morph.tests
        GENERATE_INFOPLIST_FILE: YES
