# gitleaks 設定(secrets-scan.yml が `detect --source .` で自動読込)。
# 既定ルールは維持しつつ、ローカル開発用のプレースホルダだけ許可する。
[extend]
useDefault = true

[allowlist]
regexTarget = "line"
description = "ローカル開発用プレースホルダ(AUTH_MODE=dev の Bearer 値)"
regexes = [
  '''Bearer dev-smoke''',
  '''Bearer \$DEV_UID''',
  '''Bearer \$\{?TOKEN\}?''',
]
