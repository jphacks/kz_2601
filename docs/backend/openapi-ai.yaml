openapi: 3.1.0
info:
  title: ai API
  version: 0.1.0
  description: |
    音声/文字 → Claude → DSL JSON 生成 → appconfig へ反映。
    - 認証・エラー形式・ページングは appconfig と同一 (`openapi-appconfig.yaml` の `Error` を再利用)。
    - ai は受け取った Bearer をそのまま appconfig へ転送する。
servers:
  - url: http://localhost:8081/v1
  - url: https://ai-REPLACE.a.run.app/v1
security:
  - firebaseAuth: []

paths:
  /generate:
    post:
      summary: 発話から新しい DSL を生成して適用
      description: |
        **2 モード (確定)**: 初回生成 = フル DSL、2 回目以降の改変 = JSON Patch (RFC 6902)。
        1. text(または audio→Whisper で text) を得る
        2. appconfig から現行 DSL を取得 (`baseVersion` 省略時は現行)
        3. モード判定: 現行が初期状態(entities 空・音声画面のみ) or `mode=create` → **full**。それ以外 → **patch** (`mode=auto` の既定)。「元に戻して」は restore
        4. full: Claude 構造化出力 (root AppDSL) → `dsl.Parse` → `PUT /apps/{appId}/dsl`
           patch: Claude 構造化出力 (root PatchDocument `{patch, summary}`) → `dsl.ApplyPatch` で事前検証 → `PATCH /apps/{appId}/dsl`
           検証 NG は最大 2 回再生成。patch が 3 回失敗したら full に降格 → それも失敗ならテンプレ fallback → 422
        5. appconfig が 409 なら最新を取り直して 1 回だけ再生成
        6. 新 DSL と要約を返す。iOS は返却 `dsl` を即時適用してよい (再 GET 不要)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [appId, audio]
              properties:
                appId: { type: string }
                baseVersion: { type: integer }
                audio: { type: string, format: binary, description: m4a/wav/mp3 ≤25MB ≤60s }
                language: { type: string, default: ja }
      responses:
        '200':
          description: 生成・適用成功
          content: { application/json: { schema: { $ref: '#/components/schemas/GenerateResponse' } } }
        '400': { $ref: './openapi-appconfig.yaml#/components/responses/BadRequest' }
        '401': { $ref: './openapi-appconfig.yaml#/components/responses/Unauthenticated' }
        '404': { description: appId が存在しない, content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }
        '409':
          description: baseVersion 指定時に再試行後も競合
          content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } }
        '422':
          description: 生成失敗 (再生成・fallback とも不成立)。iOS は「うまく聞き取れませんでした」を再生
          content:
            application/json:
              schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' }
              example:
                error:
                  code: generation_failed
                  message: could not produce a valid app from the request
                  details: { transcript: えーっと, attempts: 2, problems: ['screen "home" components[0]: list entity "x" does not exist'] }
        '429': { description: Claude/Whisper のレート制限 (Retry-After 付き), content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }
        '503': { description: 上流 (Claude) 障害, content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }

  /chat:
    post:
      summary: 生成前の対話 (clarify)。1 問だけ聞き返すか、要件が揃えば ready で生成用の transcript を返す
      description: |
        Issue #74 / G17。初回生成の前に数ラリーで要件を固める。`/generate` は無変更で、iOS は `ready.transcript` をそのまま `POST /generate`(mode auto/create)に渡す。
        - `messages` は会話の全履歴でも最新のユーザー発話 1 件でもよい。2 件以上ならサーバーの会話状態を置き換え、1 件なら追記する
        - 応答は `kind=question`(質問 1 文 + 選択肢 ≤3)か `kind=ready`(brief + transcript)。Claude が質問できるのは 3 ラリーまで、4 ラリー目は必ず ready
        - 最新発話が「もう作って / それでいい / お任せ / just build it / go ahead」等の短い go-ahead なら Claude を呼ばず直前の理解で即 ready(`source=shortcut`)
        - 会話状態は ai プロセス内(appId ごと・直近 10 メッセージ・30 分で消える)。永続化は後段
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: 質問または ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
              examples:
                question:
                  value: { kind: question, text: レシートの写真も残したいですか?, suggestions: [写真も残す, 文字だけでOK, お任せ], turn: 1, locale: ja, source: claude }
                ready:
                  value:
                    kind: ready
                    text: では作りますね。
                    turn: 2
                    locale: ja
                    source: claude
                    brief: { name: 筋トレ記録, purpose: 腕立てとスクワットの回数を毎日つける, entities: [トレーニング], features: [記録の一覧, 今日の合計回数, 毎朝8時の通知], native: [notification] }
                    transcript: 筋トレ記録アプリを作って。腕立てとスクワットの回数と日付を記録して、記録の一覧と今日の合計回数を見たい。毎朝8時に通知してほしい。
        '400': { $ref: './openapi-appconfig.yaml#/components/responses/BadRequest' }
        '401': { $ref: './openapi-appconfig.yaml#/components/responses/Unauthenticated' }
        '429': { description: Claude のレート制限, content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }
        '502': { description: Claude の出力がスキーマに合わず 2 回とも失敗 (generation_failed), content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }
        '503': { description: 上流 (Claude) 障害, content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }

  /chat/{appId}:
    delete:
      summary: 対話の会話状態を消す (iOS が「最初から」「キャンセル」した時)
      parameters:
        - { name: appId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 消した (存在しなくても 204) }

  /transcribe:
    post:
      summary: 音声→文字 (optional。WhisperKit が使えない端末向け)
      description: '`OPENAI_API_KEY` 未設定時は 501 `not_configured`。'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
                language: { type: string, default: ja }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
                  language: { type: string }
                  durationMs: { type: integer }
        '413': { description: 音声が大きすぎる, content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }
        '501': { description: 未設定, content: { application/json: { schema: { $ref: './openapi-appconfig.yaml#/components/schemas/Error' } } } }

  /health:
    get:
      security: []
      summary: liveness
      responses: { '200': { description: ok } }

components:
  securitySchemes:
    firebaseAuth: { type: http, scheme: bearer, bearerFormat: Firebase ID token }
  schemas:
    GenerateRequest:
      type: object
      required: [appId, text]
      properties:
        appId: { type: string }
        text: { type: string, description: 文字起こし済みの発話 (WhisperKit 経由) }
        locale:
          type: string
          enum: [ja, en]
          description: UI 文言と summary の言語。省略時は発話にかな・漢字があれば ja、無ければ en(英語で話せば英語 UI)。それ以外の値は 400
        baseVersion:
          type: integer
          description: iOS が今表示している version。省略時はサーバー側で現行を取得 (競合検知を iOS が気にしない場合)
        mode:
          type: string
          enum: [auto, create, edit, undo]
          default: auto
          description: |
            create = 既存を捨てて新規アプリ (フル DSL / PUT)。edit = 既存を Patch で編集 (PATCH)。undo = 1 つ前に restore。
            auto = 現行が初期状態なら create、それ以外は edit (「元に戻して」/ "undo"・「新しく作り直して」/ "start over" はキーワードで判定)
      example: { appId: app_01HXYZ, text: 家計簿アプリが欲しい。金額とカテゴリとメモを記録したい, baseVersion: 1 }
    GenerateResponse:
      type: object
      required: [appId, version, mode, dsl, summary, locale, source]
      properties:
        appId: { type: string }
        version: { type: integer, description: 新しく作られた version }
        previousVersion: { type: integer }
        mode:
          type: string
          enum: [full, patch, restore]
          description: 実際に使われた適用モード (patch が full に降格した場合は full)。restore = undo で 1 つ前の version を復元(Claude を呼ばない)
        restoredFrom:
          type: integer
          description: mode=restore の時、復元元の version。戻せる変更が無い時(version 1 のみ)は省略され version は変わらず summary が「戻せる変更がありません。」(en は "There is nothing to undo.")になる
        patch:
          type: array
          description: mode=patch の時、適用した RFC 6902 ops (iOS は使わなくてよい。デバッグ・表示用)
          items: { $ref: '../dsl/dsl.schema.json#/$defs/PatchOp' }
        dsl: { $ref: '../dsl/dsl.schema.json', description: 適用後のフル DSL (iOS はこれを即適用) }
        summary: { type: string, description: iOS がそのまま読み上げる 1 文(locale の言語), example: 家計簿アプリを作成しました。支出の記録と今月の合計、カテゴリ別の内訳が見られます }
        locale: { type: string, enum: [ja, en], description: UI 文言と summary の言語(リクエストの locale、省略時は発話から判定した値) }
        transcript: { type: string, description: 入力が audio の時の文字起こし }
        source:
          type: string
          enum: [claude, restore, fallback_template]
          description: fallback_template の時 iOS は控えめな文言で案内。restore は undo(Claude 不使用)
        changes:
          type: array
          description: 機械生成した差分 (summary の材料)
          items:
            type: object
            required: [kind, target]
            properties:
              kind: { type: string, enum: [screen_added, screen_removed, screen_changed, entity_added, entity_removed, field_added, field_removed, app_renamed, theme_changed] }
              target: { type: string }
        latencyMs:
          type: object
          properties: { transcribe: { type: integer }, claude: { type: integer }, total: { type: integer } }
    ChatMessage:
      type: object
      required: [role, text]
      properties:
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
    ChatRequest:
      type: object
      required: [appId, messages]
      properties:
        appId: { type: string }
        messages:
          type: array
          minItems: 1
          description: 最後は user。全履歴(iOS が持つ分)か最新 1 件
          items: { $ref: '#/components/schemas/ChatMessage' }
        locale: { type: string, enum: [ja, en], description: 省略時はユーザー発話から判定 (かな・漢字があれば ja) }
      example: { appId: app_01HXYZ, messages: [{ role: user, text: 家計簿 }] }
    ChatBrief:
      type: object
      description: 現時点の要件理解 (iOS は表示に使ってもよい。生成には transcript を使う)
      required: [name, purpose, entities, features, native]
      properties:
        name: { type: string, description: アプリ名 }
        purpose: { type: string, description: 一文 }
        entities: { type: array, items: { type: string }, description: 記録する項目 }
        features: { type: array, items: { type: string }, description: 見たい一覧・集計・ボタンなど }
        native:
          type: array
          items: { type: string }
          description: 必要なネイティブ機能の英小文字キーワード (camera / notification / calendar / map / location / share …)。無ければ空配列
    ChatResponse:
      type: object
      required: [kind, text, turn, locale, source]
      properties:
        kind: { type: string, enum: [question, ready] }
        text: { type: string, description: 'question: 質問文 (読み上げる)。ready: 「では作りますね。」/ "Got it, I''ll build it now."' }
        suggestions:
          type: array
          maxItems: 3
          items: { type: string }
          description: question の時だけ。チップとして出す短い選択肢 (そのまま次の user text に使える)
        turn: { type: integer, description: これまでのユーザー発話数 (1 始まり)。4 以上は必ず ready }
        brief: { $ref: '#/components/schemas/ChatBrief', description: ready の時だけ }
        transcript: { type: string, description: ready の時だけ。要件を 1 段落にまとめた一人称の依頼文。これを POST /generate の text に渡す }
        locale: { type: string, enum: [ja, en] }
        source:
          type: string
          enum: [claude, shortcut, forced]
          description: shortcut = go-ahead 語で Claude を呼ばず即 ready。forced = 4 ラリー目 (または 1 発目の go-ahead) で ready に寄せた
        latencyMs:
          type: object
          properties: { claude: { type: integer }, total: { type: integer } }
        meta:
          type: object
          description: 診断用 (model / attempts / usage)
