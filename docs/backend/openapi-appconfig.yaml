# 書き方(#516・PR の衝突を減らすため):
# - enum・tags などのリストは 1 行 1 項目・名前順。components/schemas も名前順に保つ。
# - 新しい path はファイル末尾でなく、同じ tag の path の隣に足す。
openapi: 3.1.0
info:
  title: appconfig API
  version: 0.1.0
  description: |
    アプリ DSL JSON の CRUD・バージョン管理・汎用レコード API。
    - 認証: `Authorization: Bearer <Firebase ID token>`。uid はトークンから取得し URL には含めない。
    - App Check(#318): iOS は `X-Firebase-AppCheck` も付ける。`APP_CHECK_MODE=enforce` の時、無い・無効なら 401 `app_check_failed`(`details.reason`: missing / invalid / wrong_app / unconfigured)。off / log では無くても通る。`/health`・`/s/{token}`・`/v1/client-config` は対象外。`docs/infra/app-check.md`
    - すべてのパスは呼び出しユーザー自身の `users/{uid}/...` に束縛される。
    - エラーは全て `Error` 形式。ページングは `pageSize` + `pageToken` / `nextPageToken`。
    - DSL の本体スキーマは `../dsl/dsl.schema.json` を参照 (OpenAPI 内では `$ref`)。
servers:
  - url: http://localhost:8080/v1
    description: local (AUTH_MODE=dev では `X-Debug-Uid` ヘッダで代替可)
  - url: https://appconfig-REPLACE.a.run.app/v1
security:
  - firebaseAuth: []
tags:
  - { name: account, description: 'アカウント削除(#119)。architecture.md §4.1' }
  - { name: apps }
  - { name: dsl }
  - { name: entities }
  - { name: entitlements, description: 'Tailor It Pro の権利(#314)。StoreKit 2 の署名付き取引をサーバーで検証して保存する。architecture.md §6.8' }
  - { name: feedback, description: 'アプリ内のフィードバック(#319)。architecture.md §3.5' }
  - { name: matching, description: '仲間探しのアプリの相互承認(#507)。docs/backend/features/matching.md' }
  - { name: members, description: 'scope:shared の参加者(#254)。architecture.md §3.4' }
  - { name: metrics, description: 'aiButton の端末内 AI の集計(#446)。docs/analytics/ai-button-metrics.md' }
  - { name: records }
  - { name: release, description: 'リリース申請(#76)。architecture.md §3.3' }
  - { name: sharing, description: 'シェアリンク(#49)と公開カタログ「探す」(#50)。architecture.md §3.2' }
  - { name: versions }

paths:
  /apps:
    get:
      tags: [apps]
      summary: 自分のアプリ一覧
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AppSummary' } }
                  nextPageToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [apps]
      summary: アプリ作成 (初期 DSL = 音声画面のみ)
      description: body の `dsl` を省略すると `dsl.Initial()` で作成。初回起動時に iOS が 1 回呼ぶ。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 省略時は dsl.app.name }
                dsl: { $ref: '../dsl/dsl.schema.json' }
      responses:
        '201':
          description: Created
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AppWithDSL' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidDSL' }

  /apps/{appId}:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [apps]
      summary: アプリ情報 (DSL 含む)
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AppWithDSL' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [apps]
      summary: メタ更新 (名前・status)
      description: |
        `name`(変身一覧の「名前を変える」・#277)は前後の空白を除いて 1〜40 文字。名前は `dsl.app.name` にも書き込み、
        **新しい version として積む**(`source.kind=manual`・`mode=patch`・`patch=[{op:add,path:/app/name}]`)。
        DSL の書き込みは毎回 `dsl.app.name` をアプリの名前に写すので、メタだけ変えると次の音声編集で元に戻るため。
        同じ名前なら version は進めない。`status` だけの時は version を進めない。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                status: { type: string, enum: [active, archived] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppSummary' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 名前の書き込み中に別の版が積まれた(取り直して再送), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [apps]
      summary: アプリ削除 (物理削除・#180)
      description: |
        Firestore から**物理削除**する(元に戻せない)。消すのは**呼び出したユーザーが持ち主のもの**だけ:
        - `users/{uid}/apps/{appId}` とその配下(`versions/*`・`entities/*/records/*`)
        - 自分が発行したこのアプリのシェアリンク `shares/*`(`ownerUid == uid && appId`)
        - 自分の「探す」掲載 `public_apps/{appId}` と配下の `installs/*`
        - 自分の共有ミラー `apps_public/{appId}` と配下の共有レコード `entities/*/records/*`
        Firestore は親を消してもサブコレクションが残るので、配下を辿って BulkWriter で消す。自分の木は最後に消す(途中で失敗しても再実行できる)。
        **残すもの**: 他人が「探す」/シェアからインストール済みのコピー(別 appId・その人の木)、同じ appId に参加しているメンバー自身のコピー、
        他人が持ち主の掲載/ミラー/シェア、`app_owners/{appId}`(作成者の記録。appId の乗っ取り防止のため残す)、リリース申請。
        参加メンバーが消した場合は自分のコピーだけが消え、持ち主の掲載・シェア・共有レコードは残る。
        他人のアプリは自分の木に無いので 404。消した後にもう一度呼ぶと 404。
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/order:
    put:
      tags: [apps]
      summary: 変身一覧の並び順を保存 (#277)
      description: |
        `ids` はユーザーが並べた順。各アプリの `sortIndex` を 位置+1 にする(1 が先頭)。`ids` に無いアプリは今の `sortIndex` のまま
        (新しく作ったアプリは `sortIndex` を持たず、iOS は先頭に出す)。自分の木に無い id は飛ばす。`updatedAt` は変えない。
        並び順はサーバー(`users/{uid}/apps/{appId}.sortIndex`)に持つので、Apple ID に引き継いだ uid(#276)なら機種変更でも残る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 400, uniqueItems: true, items: { type: string } }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }

  /apps/{appId}/duplicate:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    post:
      tags: [apps]
      summary: アプリを複製 (#277)
      description: |
        今の DSL(画面の定義)だけを**新しい appId** に複製する(version 1 = 初期 → version 2 = 複製、`source.kind=import`)。
        **記録(レコード)は複製しない**。shared/public entity を含むアプリも新しい appId になる(シェアの取り込みと違い、元の共有ボードには参加しない)。
        `name` を省略すると元の名前。名前は `dsl.app.name` にも書く。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '201':
          description: Created
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AppWithDSL' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{appId}/events:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [dsl]
      summary: 変化通知(Server-Sent Events・ホットリロード用・#82)
      description: |
        「何が変わったか」だけを流す。本体は `GET /dsl` / `GET /records` で取り直す(読み取り権限は既存 API と同じ)。
        backend は Firestore の snapshot listener(`users/{uid}/apps/{appId}` と、現行 DSL の各 entity の records
        コレクション。public/shared entity は `apps_public/{appId}/...`)を持つ。records は `updatedAt` 降順 100 件の窓。
        未知 appId は `GET /dsl` と同じく seed する。

        ```
        retry: 2000
        event: hello    data: {"version":7,"entities":["post"]}
        event: records  data: {"entity":"post"}
        event: dsl      data: {"version":8}      # 直後に bye(entity 構成が変わり得るので張り直させる)
        event: bye      data: {}                 # 予定終了(既定 50 秒・EVENTS_MAX_STREAM)。即再接続してよい
        : ping                                   # 15 秒ごとの心拍
        ```
        `bye` 無しで切れたらリスナー障害。クライアントはポーリングに落としつつ指数バックオフで再接続する。
      responses:
        '200':
          description: SSE ストリーム
          content: { text/event-stream: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /apps/{appId}/dsl:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [dsl]
      summary: 現在の DSL (iOS ホットリロード用)
      description: |
        `If-None-Match: "<version>"` が現行と一致すれば 304。ETag は `"<currentVersion>"` (例 `"7"`)。
        iOS は `GET /apps/{appId}/events`(SSE)で version 変化を知ってから取得する(フォールバックはポーリング)。

        **共有アプリのインストール (#47)**: 自分の `users/{uid}/apps/{appId}` が無い appId で呼ぶと、他ユーザーが
        `apps_public/{appId}` に公開した DSL (public/shared entity を含むアプリを PUT/PATCH した時に自動複製) があればそれを、
        無ければ初期 DSL を version 1 として自分の下に作って返す。以後の編集は自分のコピーに対して行われる。
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string, examples: ['"7"'] }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string }, description: 'no-cache' }
          content: { application/json: { schema: { $ref: '#/components/schemas/DSLEnvelope' } } }
        '304': { description: Not Modified }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [dsl]
      summary: 'JSON Patch (RFC 6902) を適用して新バージョン作成 — 2回目以降の改変はこちら (確定)'
      description: |
        **編集モード。** ai サービスが Claude に生成させた Patch をそのまま送る。
        1. `If-Match: "<baseVersion>"` 必須。Patch は基底バージョン依存なので不一致は 409 (ai は最新を取り直して再生成)。
        2. サーバーは `dsl.ApplyPatch(現行DSL, patch)` = 適用 → JSON Schema → 意味検証。失敗は 422 に全問題を列挙 (現行 DSL は無変更)。
        3. 成功時は `versions/{n+1}` に **フルスナップショット `dsl` と `patch` の両方**を保存。
        Patch の `value` は `docs/dsl/dsl.schema.json#/$defs/PatchValue` (プリミティブ or DSL 部分文書) に限る。ops 上限 50。
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string, examples: ['"6"'] }
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              type: array
              items: { $ref: '../dsl/dsl.schema.json#/$defs/PatchOp' }
            example:
              - { op: add, path: /entities/0/fields/-, value: { id: shop, name: 店名, type: string } }
              - { op: add, path: /screens/1/components/0/children/-, value: { type: textField, field: shop, label: 店名 } }
          application/json:
            schema:
              type: object
              required: [patch]
              description: 'JSON Patch をメタ情報付きで送る形 (ai サービスはこちらを使う)'
              properties:
                patch: { type: array, items: { $ref: '../dsl/dsl.schema.json#/$defs/PatchOp' } }
                source: { $ref: '#/components/schemas/VersionSource' }
      responses:
        '201':
          description: 新バージョン作成 (適用後のフル DSL を返す)
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DSLEnvelope' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '412': { description: 'If-Match ヘッダ欠落', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/InvalidDSL' }
    put:
      tags: [dsl]
      summary: 'DSL 全体を置き換えて新バージョン作成 — 初回生成 / create モード / フォールバック用 (確定)'
      description: |
        **フルモード。** 初回生成(初期状態からの生成)・「新しいアプリにして」(create)・Patch 失敗時の降格・テンプレ fallback が使う。
        楽観ロック: `If-Match: "<baseVersion>"` 必須。現行と不一致なら 409 (ボディに現行 version)。
        サーバーは `dsl.Parse` (JSON Schema + 意味検証) を通し、失敗は 422 に全問題を列挙する。
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string, examples: ['"6"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dsl]
              properties:
                dsl: { $ref: '../dsl/dsl.schema.json' }
                source: { $ref: '#/components/schemas/VersionSource' }
      responses:
        '201':
          description: 新バージョン作成
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VersionSummary' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '412': { description: 'If-Match ヘッダ欠落', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/InvalidDSL' }

  /apps/{appId}/versions:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [versions]
      summary: バージョン履歴 (新しい順・DSL 本体は含まない)
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VersionSummary' } }
                  nextPageToken: { type: string }

  /apps/{appId}/versions/{version}:
    parameters: [{ $ref: '#/components/parameters/AppId' }, { $ref: '#/components/parameters/Version' }]
    get:
      tags: [versions]
      summary: 特定バージョンの DSL
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DSLEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{appId}/versions/{version}/restore:
    parameters: [{ $ref: '#/components/parameters/AppId' }, { $ref: '#/components/parameters/Version' }]
    post:
      tags: [versions]
      summary: ロールバック (該当バージョンの内容で新バージョンを作る・履歴は消さない)
      description: |
        応答は VersionSummary に復元後の `dsl` を足したもの(= DSLEnvelope と同じ形で読める)。
        `source.kind=restore` / `source.restoredFrom` に元バージョンが入る。
        クライアントは続けて `GET /dsl` を叩かずにこの本文をそのまま現行 DSL として使ってよい(#67)。
      responses:
        '201':
          description: Created
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RestoreResult' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{appId}/entities:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [entities]
      summary: エンティティ定義一覧 (現行 DSL の entities[] の読み出しビュー)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, version]
                properties:
                  version: { type: integer }
                  items: { type: array, items: { $ref: '../dsl/dsl.schema.json#/$defs/Entity' } }

  /apps/{appId}/entities/{entityId}:
    parameters: [{ $ref: '#/components/parameters/AppId' }, { $ref: '#/components/parameters/EntityId' }]
    get:
      tags: [entities]
      summary: エンティティ定義
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '../dsl/dsl.schema.json#/$defs/Entity' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [entities]
      summary: エンティティ定義を作成/更新 (内部的には DSL の新バージョンを作る糖衣)
      description: '`If-Match` 必須。`/dsl` PUT と同じ検証・同じバージョン経路。UI 側のデバッグ・手動修正用。'
      parameters:
        - { in: header, name: If-Match, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '../dsl/dsl.schema.json#/$defs/Entity' } } }
      responses:
        '201': { description: 新バージョン作成, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/VersionSummary' } } } }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/InvalidDSL' }

  /apps/{appId}/entities/{entityId}/records:
    parameters: [{ $ref: '#/components/parameters/AppId' }, { $ref: '#/components/parameters/EntityId' }]
    get:
      tags: [records]
      summary: レコード一覧
      description: |
        既定は `createdAt desc`。`sort`/`filter` は DSL の List と同じ語彙。
        複合インデックスが無い組み合わせはサーバー側メモリソート (1 entity 上限 2000 件、超過は 413)。
        public/shared entity は全ユーザーの投稿が返り、各レコードに `author`/`authorName` が付く。
        `filterField=author&filterOp=eq&filterValue=<uid>` で特定ユーザー (自分) の投稿だけに絞れる。
        **scope:shared の entity は作成者と参加者だけ**が読み書きできる (この entity の records の全操作で同じ・それ以外は 403 `not_member`・#254)。public は従来どおり誰でも。
        呼び出した人がブロックしたユーザー(`/me/blocks`)の投稿は一覧から除く(#321)。運営が非公開にした共有アプリ(`apps_public/{appId}.hidden`)は、public/shared の entity の records の全操作が 403 `unpublished`(details.reason = 運営の理由)。
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
        - { in: query, name: sortField, schema: { type: string } }
        - { in: query, name: sortDir, schema: { type: string, enum: [asc, desc] } }
        - { in: query, name: filterField, schema: { type: string } }
        - { in: query, name: filterOp, schema: { type: string, enum: [eq, neq, gt, gte, lt, lte, thisMonth, today] } }
        - { in: query, name: filterValue, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Record' } }
                  nextPageToken: { type: string }
        '403': { $ref: '#/components/responses/NotMember' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [records]
      summary: レコード作成
      description: |
        `data` は現行 DSL のフィールド定義で型検証・正規化。未知キーは 400。`required` 欠落は 422。
        entity.scope が public/shared なら誰でも作成でき、レスポンスの `author`(uid) と `authorName` はサーバーが付ける
        (`data` に author/authorName は入れられない。冪等 id は uid+clientId から導出するので他人の clientId と衝突しない)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/components/schemas/RecordData' }
                clientId: { type: string, description: 冪等キー (同じ clientId の再送は既存を返す) }
                authorName: { type: string, maxLength: 64, description: '投稿者の表示名 (public/shared entity のみ使われる。省略時 "匿名")' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Record' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/NotMember' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRecord' }
    delete:
      tags: [records]
      summary: エンティティの全レコード削除 (デモリセット用・`?confirm=true` 必須)
      description: public/shared entity では**自分が投稿したレコードだけ**削除する (他人の投稿は残る)。
      parameters: [{ in: query, name: confirm, required: true, schema: { type: boolean } }]
      responses:
        '204': { description: Deleted }

  /apps/{appId}/entities/{entityId}/records/{recordId}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { $ref: '#/components/parameters/EntityId' }
      - { in: path, name: recordId, required: true, schema: { type: string } }
    get:
      tags: [records]
      summary: レコード取得
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Record' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [records]
      summary: レコード部分更新 (data のキー単位でマージ)
      description: public/shared entity では `author == 自分` のレコードだけ更新できる (他人のは 403)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties: { data: { $ref: '#/components/schemas/RecordData' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Record' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRecord' }
    delete:
      tags: [records]
      summary: レコード削除
      description: public/shared entity では `author == 自分` のレコードだけ削除できる (他人のは 403)。
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{appId}/entities/{entityId}/records/{recordId}/marks/{markId}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { $ref: '#/components/parameters/EntityId' }
      - { in: path, name: recordId, required: true, schema: { type: string } }
      - { in: path, name: markId, required: true, schema: { type: string }, description: 'entity.marks の id (例 like / save)' }
    put:
      tags: [records]
      summary: 自分の印を付ける (#255・冪等)
      description: public/shared の entity で、現行 DSL の entity.marks に宣言された印だけ。1 人 1 回 (2 回目は件数を増やさない)。他人のレコードにも付けられる (entity.edit は関係しない)。
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MarkState' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [records]
      summary: 自分の印を外す (#255・冪等)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MarkState' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{appId}/share:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    post:
      tags: [sharing]
      summary: シェアリンクを発行
      description: |
        自分のアプリ(`users/{uid}/apps/{appId}`)の**現行 DSL のスナップショット**を `shares/{token}` に保存し、推測不能なトークン(192 bit)を返す。
        レコードは含まない。他人のアプリは自分の木に無いので 404。
        publish と違い作成者に限らない(トークンは発行ごとに別でグローバルに占有するものが無く、共有アプリの参加者が友だちを招くため・#118)。
        中身が初期 DSL のまま(生成前・GET /dsl で seed されただけ)のアプリは 400。
        scope:shared の entity を含むアプリは**作成者と参加者だけ**が発行できる(appId を知っているだけの人が自分を招けないように・#254)。それ以外は 403 `not_member`。
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } }
        '400': { description: 中身が初期 DSL のまま, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/NotMember' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shares/{token}:
    parameters: [{ $ref: '#/components/parameters/ShareToken' }]
    get:
      tags: [sharing]
      summary: シェアのプレビュー(import 前の確認用)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  name: { type: string }
                  description: { type: string }
                  dslVersion: { type: integer }
                  components: { type: array, items: { type: string } }
                  sharedData: { type: boolean, description: 'shared/public entity を含む(import すると元アプリの共有データに参加する)' }
                  mine: { type: boolean }
        '403': { $ref: '#/components/responses/Unpublished' }
        '404': { description: 取り消し済み or 存在しない, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [sharing]
      summary: シェアリンクを取り消す(発行者のみ・冪等)
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shares/{token}/import:
    parameters: [{ $ref: '#/components/parameters/ShareToken' }]
    post:
      tags: [sharing]
      summary: シェアされたアプリを自分のアプリとして追加
      description: |
        認証済みなら誰でも可。スナップショットの DSL を自分の木に複製する(version 1 = 初期 → version 2 = 複製 DSL、`source.kind=import`)。**レコードは複製しない**。
        - private entity だけのアプリ: **新しい appId**(UUID)に複製
        - shared/public entity を含むアプリ: **元の appId のまま**参加(`joined: true`)。共有レコードは appId 単位(`apps_public/{appId}`・#93)なので、受け取った人も同じ投稿を見る。既に持っていれば何もせず返す(`created: false`)
        - scope:shared の entity を含むアプリ: 呼び出したユーザーを**参加者**(`apps_public/{appId}/members/{uid}`)に入れる(`member: true`・#254)。既に参加していれば表示名だけ更新。
          リンクの発行者がもう参加者でない(作成者に外された・自分で抜けた)場合は 403(`details.reason: inviter_left`)で、アプリも追加しない。参加者が 100 人に達していれば 403(`members_full`)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 64, description: '参加者一覧に出す名前(任意・scope:shared のアプリだけで使う)' }
      responses:
        '201': { description: Imported, content: { application/json: { schema: { $ref: '#/components/schemas/InstallResult' } } } }
        '403': { description: 'リンクの発行者が参加者でない(inviter_left) / 参加者が上限(members_full)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Unpublished' }
        '404': { description: 取り消し済み or 存在しない, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /apps/{appId}/publish:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    post:
      tags: [sharing]
      summary: 「探す」に公開(作成 or 更新)
      description: |
        自分のアプリの現行 DSL を `public_apps/{appId}` に掲載する。再実行で DSL・説明を更新(installs は保持)。
        **その appId の作成者だけ**が掲載できる(#153)。作成者 = その appId に最初に実コミット(生成 / PUT・PATCH /dsl / restore / 新規 appId への複製)した uid で、`app_owners/{appId}` に記録する。
        GET /dsl で他人の appId を開いた(seed・共有アプリへの参加)だけ、または参加後に自分の木で編集しただけの人は 403。
        記録の無い既存アプリは「探す」の掲載者 → `apps_public` の持ち主の順で作成者とみなし、どちらも無ければ最初に publish した人を作成者として記録する。
        中身が初期 DSL のまま(components / entities が空)のアプリは 400。
        name / description は省略時 DSL の `app.name` / `app.description`、authorName は省略時 "匿名"。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                description: { type: string, maxLength: 300 }
                tags: { type: array, maxItems: 8, items: { type: string, maxLength: 20 }, description: '先頭の # は除去' }
                authorName: { type: string, maxLength: 64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicApp' } } } }
        '400': { description: 入力不備 / 中身が初期 DSL のまま, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: その appId の作成者ではない, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sharing]
      summary: 非公開にする(掲載者のみ)
      description: 掲載者が取り下げる。運営による非公開化は `cmd/moderate hide-listing`(`public_apps/{id}.hidden`・#321・docs/infra/moderation.md)で、掲載者が再公開しても非公開のまま。
      responses:
        '204': { description: Unpublished }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public-apps:
    get:
      tags: [sharing]
      summary: 公開アプリを検索
      description: |
        名前・説明・タグ・作者名の部分一致(大文字小文字無視)。件数が少ない前提で最大 500 件をメモリ内で絞り込む(全文検索はしない)。
        運営が非公開にした掲載は掲載者本人にだけ返る(`hidden`・`hiddenReason` 付き)。ブロックしたユーザーの掲載は返らない(#321)。
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [popular, new], default: popular }, description: 'popular = installs 降順 → 更新日時降順 / new = 更新日時降順' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublicApp' } }
                  nextPageToken: { type: string }
        '400': { description: sort が不正, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /public-apps/{id}/install:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    post:
      tags: [sharing]
      summary: 公開アプリをインストール
      description: |
        import と同じ複製(レコード無し・public の entity を含めば元 appId に参加)。
        「探す」は誰でも見られるので、**共有が scope:shared だけのアプリは新しい appId の独立コピー**になり、追加した人がその作成者になる(掲載者の家族のデータには参加しない・#254)。
        public と shared の両方を含むアプリは元 appId に参加するが、参加者ではないので shared の entity は 403 `not_member`。
        同じユーザーの 2 回目以降は新しく複製せず、最初に追加したアプリを返す(`created: false`・アーカイブ済みなら active に戻す)。
        installs は uid ごとに 1 回だけ +1(掲載者本人は数えない・`public_apps/{id}/installs/{uid}` に記録・#154)。
      responses:
        '201': { description: Installed, content: { application/json: { schema: { $ref: '#/components/schemas/InstallResult' } } } }
        '403': { $ref: '#/components/responses/Unpublished' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports:
    post:
      tags: [moderation]
      summary: 通報する(#321・審査 1.2)
      description: |
        「探す」の掲載・シェアリンク・共有アプリ・共有アプリの投稿を運営に通報する。`reports/{id}` に保存し、
        ログ `moderation: report`(uid と内容は出さない)を運営のアラートが拾う(docs/infra/moderation.md)。
        保存するのは通報者の uid・対象の種類と ID・対象の持ち主 / 投稿者の uid(サーバーが引く)・理由・日時だけ(内容の写しも自由記述も持たない)。
        同じ人が同じ対象を通報し直しても 1 件(200 `created: false`)。新しい通報は 1 人 1 日(JST)30 件まで(超えると 429 `rate_limited`)。
        自分のものは 400。対象が無ければ 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              properties:
                kind: { type: string, enum: [listing, share, app, record] }
                id: { type: string, description: 'listing = 掲載の id / share = トークン' }
                appId: { type: string, description: 'app / record' }
                entityId: { type: string, description: record }
                recordId: { type: string, description: record }
                reason: { type: string, enum: [spam, sexual, violence, harassment, illegal, privacy, other] }
      responses:
        '201': { description: 通報した, content: { application/json: { schema: { $ref: '#/components/schemas/ReportResult' } } } }
        '200': { description: 通報済み(created false), content: { application/json: { schema: { $ref: '#/components/schemas/ReportResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: 今日の通報の上限, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me/blocks:
    get:
      tags: [moderation]
      summary: ブロックしているユーザー(#321)
      description: 古い順に最大 500 人。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Block' } }
    post:
      tags: [moderation]
      summary: ユーザーをブロックする(#321)
      description: |
        以後、そのユーザーの共有アプリの投稿(GET records)と「探す」の掲載が自分に返らない(相手には知らせない)。
        `uid`(投稿の `author`)か `listingId`(掲載者をサーバーが引く)のどちらか。`users/{uid}/blocks/{blockedUid}` に保存。冪等。自分は 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid: { type: string }
                name: { type: string, maxLength: 64, description: '一覧に出す名前(投稿の authorName)。listingId の時の省略は掲載の authorName' }
                listingId: { type: string }
      responses:
        '201': { description: Blocked, content: { application/json: { schema: { $ref: '#/components/schemas/Block' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/blocks/{uid}:
    parameters: [{ in: path, name: uid, required: true, schema: { type: string } }]
    delete:
      tags: [moderation]
      summary: ブロックを解除する(冪等)
      responses:
        '204': { description: Unblocked }

  /apps/{appId}/members:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [members]
      summary: 参加者一覧(作成者と参加者だけ)
      description: |
        作成者(`app_owners`・ドキュメント無しで常に参加者)を先頭に、参加した順で返す(最大 100 人)。
        参加は `POST /shares/{token}/import`。作成者・参加者以外は 403 `not_member`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, role]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Member' } }
                  role: { type: string, enum: [owner, member], description: 呼び出したユーザーの立場 }
        '403': { $ref: '#/components/responses/NotMember' }
  /apps/{appId}/members/{uid}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { in: path, name: uid, required: true, schema: { type: string }, description: '外す人の uid。`me` で自分(退出)' }
    delete:
      tags: [members]
      summary: 参加者を外す / 自分が抜ける
      description: |
        `me`(または自分の uid)は退出で、参加していなくても 204(冪等)。他人を外せるのは**作成者だけ**。作成者は抜けられない(400・アプリを消す)。
        外された人が発行したシェアリンクでは以後参加できない。作成者自身が発行したリンクは取り消すまで有効なので、外した人に再参加されたくなければ `DELETE /shares/{token}` も行う。
        外された人の端末のアプリ(自分の木のコピー)と、その人の過去の投稿は残る。
      responses:
        '204': { description: Removed }
        '400': { description: 作成者は抜けられない / uid が不正, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 作成者以外が他人を外そうとした, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: その uid は参加者ではない(他人を外す時), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /apps/{appId}/interests:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [matching]
      summary: 届いた / 送った「つながりたい」(#507)
      description: |
        `box=incoming`(既定)は自分に届いて未回答のもの、`outgoing` は自分が送って未回答のもの。新しい順に最大 500 件。
        相手が見送った・ブロックした送信も `outgoing` に `pending` のまま出る(断られたことは相手に伝えない)。お互いにブロックしている人(どちら向きでも)は出さない。
        アプリ(公開 DSL)に `match:"profile"` の entity が無ければ 404(`details.reason: no_matching`)。プロフィールが scope:shared なら作成者・参加者以外は 403 `not_member`。運営が非公開にしたアプリは 403 `unpublished`。
      parameters:
        - { in: query, name: box, schema: { type: string, enum: [incoming, outgoing], default: incoming } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Interest' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/NotMember' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [matching]
      summary: 「つながりたい」を送る(#507)
      description: |
        相手のプロフィールのレコード(`recordId`)に送る。自分のプロフィール(`fromRecordId`・自分が書いたもの)が要る。
        `ageConfirmed: true`(本人による 18 歳以上の確認)が無ければ 400(`details.reason: age_unconfirmed`)。
        相手がもう自分に送っていれば、これが承認になり `matched` を返す。それ以外は `pending`(送り直しても 1 件)。
        自分がブロックした人には 400(`details.reason: blocked`)。相手が自分をブロックしている時は `pending` を返すが相手には届かない。
        1 人 1 日(JST)30 回まで(超えると 429 `rate_limited`・送り直しも数える)。自分のプロフィールへは 400。プロフィールが無ければ 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordId, fromRecordId, ageConfirmed]
              properties:
                recordId: { type: string, description: 相手のプロフィール(match:profile の entity)のレコード id }
                fromRecordId: { type: string, description: 自分のプロフィールのレコード id }
                ageConfirmed: { type: boolean, description: '本人が 18 歳以上と確認した(iOS が初回に確認を出す)' }
      responses:
        '200': { description: 送った / つながった, content: { application/json: { schema: { $ref: '#/components/schemas/Interest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/NotMember' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: 今日の上限, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /apps/{appId}/interests/{uid}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { in: path, name: uid, required: true, schema: { type: string }, description: 相手の uid }
    delete:
      tags: [matching]
      summary: 届いたものを見送る / 送ったものを取り下げる(冪等)
      description: 相手には伝えない(相手の送信は `pending` のまま見える)。見送った人からの送り直しは届かない。つながった後は `DELETE /matches/{uid}`。
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/BadRequest' }
  /apps/{appId}/interests/{uid}/accept:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { in: path, name: uid, required: true, schema: { type: string }, description: 送ってきた人の uid }
    post:
      tags: [matching]
      summary: 届いた「つながりたい」を承認する(#507)
      description: '`ageConfirmed: true` が要る(無ければ 400 `age_unconfirmed`)。その人からの未回答の送信が無い・お互いにブロックしている時は 404。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ageConfirmed]
              properties:
                ageConfirmed: { type: boolean }
      responses:
        '200': { description: つながった, content: { application/json: { schema: { $ref: '#/components/schemas/Interest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /apps/{appId}/matches:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    get:
      tags: [matching]
      summary: つながった人(#507)
      description: |
        お互いに承認した人。新しい順に最大 500 人。お互いにブロックしている人は出さない。
        この人たちと自分だけが、`match:"matched"` の entity のレコード(連絡先など)を GET records で読める(それ以外の人の分は一覧に出ず、id を指定しても 404)。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Interest' } }
        '403': { $ref: '#/components/responses/NotMember' }
        '404': { $ref: '#/components/responses/NotFound' }
  /apps/{appId}/matches/{uid}:
    parameters:
      - { $ref: '#/components/parameters/AppId' }
      - { in: path, name: uid, required: true, schema: { type: string } }
    delete:
      tags: [matching]
      summary: つながりを解除する(#507)
      description: どちら側からでも解除できる。以後お互いの matched のレコードは見えない。解除された側からの送り直しは届かない。つながっていなければ 404。
      responses:
        '204': { description: Unmatched }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me:
    delete:
      tags: [account]
      summary: アカウント削除(論理削除・#119)
      description: |
        App Store 審査ガイドライン 5.1.1(v) 対応。**論理削除**(データは物理的には消さない):
        - `users/{uid}` に `status: "deleted"`・`deletedAt` を付ける(再実行でも最初の `deletedAt` を保つ)
        - 自分のアプリ(`users/{uid}/apps/*`)をすべて `status: "archived"` に(`DELETE /apps/{appId}` と同じ扱い)
        - 自分のシェアリンク(`shares/*`)を取り消し(`revoked: true` → 受け取り側は 404)
        - 自分の「探す」の掲載(`public_apps/*`)を取り下げ
        - 共有データ(`apps_public/*` 配下)の自分の投稿は**残す**。Firebase Auth のユーザーも**削除しない**
          (iOS が 204 の後にクライアント SDK で Firebase のユーザーを削除するので、同じ Apple ID で再サインインすると新しい uid になる)
        以後この uid の認証済みリクエストは **410 `account_deleted`**(この `DELETE /me` だけは何度でも 204)。
        冪等: 削除済みの印を最初に書くので、途中で失敗しても再実行で残りが終わる。
        Sign in with Apple のトークン取り消しは iOS が Firebase(`Auth.revokeToken(withAuthorizationCode:)`)経由で行う。
      responses:
        '204': { description: 削除済み(2 回目以降も 204) }
        '401': { description: 未認証, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: 途中で失敗。再実行で続きが終わる, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/entitlements:
    get:
      tags: [entitlements]
      summary: 自分の Pro の権利(#314)
      description: |
        `users/{uid}/entitlements/pro` を返す。`isPro` は「取り消されていない・期限内・許可された環境(`APPSTORE_ENVIRONMENTS`)」。
        ai の回数制限(#449)も同じ判定で Pro の上限にする。iOS は購入・復元・起動時に `POST /me/entitlements/apple` で送った結果をこれで確かめられる。
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '410': { description: 退会済み(`account_deleted`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me/entitlements/apple:
    post:
      tags: [entitlements]
      summary: StoreKit 2 の署名付き取引(JWS)を送って Pro を保存する(#314)
      description: |
        iOS が購入・復元の後と起動時(`Transaction.currentEntitlements`)に `VerificationResult.jwsRepresentation` を送る。
        サーバーは Apple に問い合わせずにローカルで検証する:
        - `x5c` の 3 枚(leaf・中間・root)を **Apple Root CA - G3(バックエンドに埋め込み・固定)** まで検証。中間・leaf の Apple のマーカー拡張(OID `1.2.840.113635.100.6.2.1` / `.6.11.1`)も確かめる。検証の時刻は取引の `signedDate`
        - `alg` は ES256 だけ。leaf の公開鍵で署名を確かめる
        - `bundleId`(`APPSTORE_BUNDLE_IDS`)・`productId`(`APPSTORE_PRODUCT_IDS`)・`environment`(`APPSTORE_ENVIRONMENTS`、既定 Sandbox と Production)が許可リストにあること
        - `expiresDate` があること(Pro は自動更新サブスクだけ)

        期限切れ・取り消し(返金)の取引もエラーにせず保存する(`isPro: false` になる)。ただし古い取引が新しい取引を上書きすることはない(期限が後のもの・同じ取引の取り消しだけが上書き)。

        **取引と uid の結びつき**: `appstore_transactions/{originalTransactionId}` に uid を記録し、1 つの購読を 1 つの uid にだけ結びつける。
        - まだ結びついていない → この uid に結びつける
        - 退会済み(`DELETE /me` 後・purge 後)の uid に結びついている → この uid に移す(同じ Apple ID で入り直した場合)
        - 別の有効な uid に結びついている → **409 `transaction_owned_by_other`**(権利は付けない・ログに残す)。サポートが `appstore_transactions/{id}` を消すと外せる

        iOS は購入時に `appAccountToken` に uid から作った UUID を入れる(サーバーでは照合のログだけ)。
        更新・解約・返金の通知(App Store Server Notifications v2)は #315 で同じ検証と保存を使う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedTransaction]
              properties:
                signedTransaction: { type: string, description: 'StoreKit 2 の JWS(`header.payload.signature`)', maxLength: 32768 }
      responses:
        '200': { description: 保存後の状態, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: この購読は別の有効なアカウントに結びついている
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: transaction_owned_by_other, message: 'this subscription is linked to another account' } }
        '410': { description: 退会済み(`account_deleted`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422':
          description: '検証に失敗(改ざん・Apple 以外の証明書・対象外の bundleId / productId / 環境など)。`details.reason` は malformed / chain / signature / bundle_id / product_id / environment / not_subscription'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_transaction, message: 'the signed transaction could not be verified', details: { reason: signature } } }

  /apps/{appId}/release-requests:
    parameters: [{ $ref: '#/components/parameters/AppId' }]
    post:
      tags: [release]
      summary: 単体アプリとしてのリリースを申請(所有者のみ・冪等)
      description: |
        自分のアプリの**現行 DSL のスナップショット**(version)と用途・連絡先を `release_requests/{id}` に `status=received` で保存する。
        同じアプリの申請中(`declined` 以外)が既にあれば**何も書かずに既存を 200 で返す**(409 にしない)。`declined` の後は新しい申請を作れる。
        他人のアプリは自分の木に無いので 404。status は API では変えず、管理者が Firestore コンソールで書き換える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, minLength: 1, maxLength: 200, description: 用途の一言(前後の空白は除去) }
                contact: { type: string, maxLength: 100, description: 連絡先(任意) }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseRequest' } } } }
        '200': { description: 申請中が既にあった(既存を返す), content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseRequest' } } } }
        '400': { description: purpose が空・長すぎる / 未知のキー, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [release]
      summary: このアプリへの自分の申請(新しい順)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ReleaseRequest' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /release-requests:
    get:
      tags: [release]
      summary: 自分の申請(全アプリ・新しい順・最大 200)
      description: 変身一覧のカードに status バッジを 1 回の呼び出しで付けるため。
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ReleaseRequest' } } } } } }

  /metrics/ai-button:
    post:
      tags: [metrics]
      summary: aiButton の端末内 AI の 1 日ごとの集計を送る(#446)
      description: |
        iOS(通常の版だけ・設定でオフにできる)が、端末のローカル日ごとに数えた回数を 1 日 1 回まとめて送る。
        サーバーは**ログに数を書くだけ**(`ai.button.availability` / `ai.button.task` / `ai.button.failure`)。Firestore には書かず、uid もログに出さない。
        値は決まったラベルと回数だけ。利用者の文・記録・DSL の中身は受けない(未知のキー・未知のラベルは 400)。
        `reportId` は日ごとに端末で作る乱数(再送の重複を SQL で消すため。端末・人とは結ばない)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days]
              properties:
                days:
                  type: array
                  minItems: 1
                  maxItems: 7
                  items:
                    type: object
                    additionalProperties: false
                    required: [reportId, day, availability]
                    properties:
                      reportId: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
                      day: { type: string, format: date, description: 端末のローカル日。今日(UTC)の 9 日前〜翌日だけ受ける }
                      availability:
                        type: string
                        enum: [available, device_not_eligible, apple_intelligence_off, model_not_ready, os_too_old, other]
                        description: その日に aiButton を表示した時の、最後に見た Foundation Models の状態
                      tasks:
                        type: array
                        maxItems: 8
                        items:
                          type: object
                          additionalProperties: false
                          required: [task]
                          properties:
                            task: { type: string, enum: [summarize, classify, rewrite, extract, suggest, generate, other], description: DSL の aiButton.task(重複不可) }
                            attempts: { type: integer, minimum: 0, maximum: 10000, description: 端末内 AI で実行した回数 }
                            failures:
                              type: object
                              description: 答えを出せなかった回数(理由ごと)
                              propertyNames:
                                enum: [unavailable, invalid_response, context_too_long, guardrail, unsupported_language, refusal, rate_limited, assets_unavailable, model_error, bad_config]
                              additionalProperties: { type: integer, minimum: 0, maximum: 10000 }
            example:
              days:
                - reportId: 0F8E2C1A-1111-4222-8333-944455556666
                  day: '2026-11-01'
                  availability: available
                  tasks:
                    - { task: summarize, attempts: 5, failures: { context_too_long: 1 } }
      responses:
        '204': { description: 受け取った(ログに書いた) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /feedback:
    post:
      tags: [feedback]
      summary: フィードバックを送る(添付はどれも任意・既定は無し)
      description: |
        `feedback/{id}` に `status=received` で保存する。本文は誰でも書ける**信頼しないデータ**(`untrusted: true` を付けて保存・#366)。
        - 添付はどれも端末で本人が選んだものだけ(既定はすべて無し)。**記録(records)の中身は受け付けない**(未知のキーは 400)。
        - `attachments.app` は参照だけ。サーバーが**呼び出したユーザー自身の木**の `versions/{dslVersion}` を読んで DSL の構造を保存する(他人のアプリは見つからない扱い)。
          見つからない(オフラインで作ったアプリ等)・256 KiB を超える場合は DSL を付けずに保存し、レスポンスの `attachments.dsl` が false になる。
        - `attachments.screenshot` は base64 の JPEG(デコード後 512 KiB まで)。Cloud Storage のバケットはまだ無いので、Firestore のバイト列のフィールドに置く。
        - `consentVersion` は送信前に見せた同意文の版(必須)。
        - 1 ユーザー 1 日(JST)`FEEDBACK_DAILY_LIMIT` 件(既定 5)。超えると 429 `rate_limited`(ai と同じ details・翌 0:00 JST まで)。
        - 保存期間は 180 日(`cmd/purge` が消す)。アカウントの消去(#458)でも消える。API で読む・消す口は無い(運営は `cmd/feedback` で読むだけ)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message, consentVersion]
              properties:
                kind: { type: string, enum: [bug, idea, other], default: other, description: 未知の値は other }
                message: { type: string, minLength: 1, maxLength: 2000, description: 本文(前後の空白は除去) }
                consentVersion: { type: string, minLength: 1, maxLength: 64, example: feedback-2026-11 }
                attachments:
                  type: object
                  additionalProperties: false
                  properties:
                    screenshot: { type: string, contentEncoding: base64, contentMediaType: image/jpeg, description: 'デコード後 512 KiB まで(超えると 413)' }
                    app:
                      type: object
                      additionalProperties: false
                      required: [appId, dslVersion]
                      properties:
                        appId: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
                        dslVersion: { type: integer, minimum: 1 }
                    device:
                      type: object
                      additionalProperties: false
                      description: 各 64 文字まで
                      properties:
                        appVersion: { type: string, example: 1.0.0 }
                        build: { type: string, example: '12' }
                        os: { type: string, example: iOS 26.1 }
                        model: { type: string, example: 'iPhone17,1' }
                        locale: { type: string, example: ja }
            example: { kind: bug, message: 'グラフが空のまま', consentVersion: feedback-2026-11, attachments: { app: { appId: 3f0c…, dslVersion: 7 } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, status, createdAt, attachments]
                properties:
                  id: { type: string, example: fb_06GPVRYJ58VK8KN57T8W54M124 }
                  status: { type: string, enum: [received] }
                  createdAt: { type: string, format: date-time }
                  attachments:
                    type: object
                    description: 実際に保存した添付
                    properties: { screenshot: { type: boolean }, dsl: { type: boolean }, device: { type: boolean } }
        '400': { description: message / consentVersion が無い・長すぎる・未知のキー・JPEG でない, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: スクショが大きすぎる / 本文全体が 1 MiB を超える, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 今日の上限。`Retry-After` と details(scope=user・limit・resetAt・retryAfterSec), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /client-config:
    get:
      security: []
      summary: iOS の最低対応版と最新版(#302)・アプリ内のお知らせ(#333)・認証不要
      description: |
        サインイン前にも iOS が起動時・前面に戻った時に読む。値は appconfig の環境変数(起動時に 1 回読む)。**未設定・不正な値のフィールドは省略 = 強制しない**。
        - `MIN_IOS_BUILD`: これ未満の CFBundleVersion は閉じられない「アップデートしてください」画面
        - `LATEST_IOS_BUILD`: これ未満は閉じられるお知らせ(MIN より小さければ MIN に揃える)
        - `IOS_APP_STORE_URL`: App Store のページ(https / itms-apps のみ)。省略時は iOS 側の既定
        - `NOTICE_JSON`: アプリ内のお知らせ(`notice`・#333)。1 行のバナーで、利用者が閉じられる。iOS は閉じた `id` を覚えるので、文面を変えて出し直す時は `id` も変える。JSON が壊れている・必須が無い・未知のフィールドがある時は `notice` を省略する(他のフィールドは出す)。手順は `docs/ops/incident-runbook.md`
        iOS は通信失敗・不正な応答では何もしない(fail open)。`notice` だけが不正な時も版の判定は続ける。`Cache-Control: public, max-age=300`(変更が届くまで最大 5 分)。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  minIOSBuild: { type: integer, minimum: 1 }
                  latestIOSBuild: { type: integer, minimum: 1 }
                  iosAppStoreUrl: { type: string, format: uri }
                  notice: { $ref: '#/components/schemas/Notice' }
              example:
                minIOSBuild: 12
                latestIOSBuild: 15
                iosAppStoreUrl: 'https://apps.apple.com/app/id0000000000'
                notice:
                  id: 2026-11-02-ai
                  severity: warning
                  message: { ja: 'AI の生成を一時的に止めています。作ったアプリはそのまま使えます。', en: 'AI generation is paused for now. Your apps still work.' }
                  linkUrl: 'https://example.com/status'

  /health:
    get:
      security: []
      summary: liveness
      description: Cloud Run(`*.run.app`)では `/healthz` が Google Front End に吸われてコンテナに届かないため `/health` を使う(`/healthz` はローカル用に残っている)。
      responses: { '200': { description: ok } }

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  parameters:
    AppId: { in: path, name: appId, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }, example: app_01HXYZ, description: '`null` / `undefined` / `nil` / `none` / `nan` / `true` / `false`(大文字小文字無視)は 400(クライアントの未設定値で不要なアプリが seed されるのを防ぐ・#154)' }
    EntityId: { in: path, name: entityId, required: true, schema: { type: string }, example: expense }
    Version: { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }
    PageSize: { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    ShareToken: { in: path, name: token, required: true, schema: { type: string }, example: H6-GGDdrAGTqrpqpbKhx4GG1ZT1VJ0Rb }
    PageToken: { in: query, name: pageToken, schema: { type: string }, description: 前レスポンスの nextPageToken (不透明文字列) }
  headers:
    ETag:
      description: '現行バージョン。`"7"` の形式'
      schema: { type: string }
  responses:
    BadRequest: { description: 入力不正, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthenticated: { description: トークン欠落/無効, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 存在しない (他人のリソースも 404), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:
      description: 共有 (public/shared) レコードの author が自分ではない。entity.edit が members なら PATCH は通り、DELETE だけが 403 になる
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: forbidden, message: 'only the author can modify this record', details: { author: 'uid_of_poster' } } }
    VersionConflict:
      description: If-Match が現行と不一致
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: version_conflict, message: 'current version is 7', details: { currentVersion: 7 } } }
    InvalidDSL:
      description: DSL がスキーマ/意味検証に失敗
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: invalid_dsl
              message: '2 problem(s)'
              details:
                problems:
                  - 'initialScreen "main" does not exist'
                  - 'screen "home" components[1]: list entity "expenses" does not exist'
    InvalidRecord:
      description: data がエンティティ定義に適合しない
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid_record, message: 'field "amount" is required', details: { field: amount } } }
    Unpublished:
      description: 運営が非公開にした(#321)。details.reason は作者に見せる理由
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unpublished, message: 'this listing was unpublished by the operator', details: { reason: '不適切な内容のため' } } }
    NotMember:
      description: scope:shared のデータに参加していない(作成者でも参加者でもない・#254)。シェアリンクから参加すれば読める
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: forbidden, message: 'join this app with a share link to see its shared data', details: { reason: not_member } } }
  schemas:
    Notice:
      type: object
      description: アプリ内のお知らせ(#333)。appconfig の環境変数 `NOTICE_JSON` と同じ形(未知のフィールドは不可)。iOS は閉じられるバナーで出し、閉じた `id` を端末に覚える。
      required: [id, severity, message]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$', description: 'お知らせの識別子。文面を変えたら変える(例: 2026-11-02-ai)' }
        severity: { type: string, enum: [info, warning], default: info, description: '`NOTICE_JSON` で省略すると info' }
        message:
          type: object
          required: [ja]
          additionalProperties: false
          description: 1 行の文面(改行・連続する空白は 1 つの空白にする)。英語の表示で `en` が無ければ `ja` を出す
          properties:
            ja: { type: string, minLength: 1, maxLength: 200 }
            en: { type: string, maxLength: 200 }
        linkUrl: { type: string, format: uri, pattern: '^https://', description: '「詳しく」で開くページ(https のみ)' }
        minIOSBuild: { type: integer, minimum: 1, description: 'この CFBundleVersion 以上だけに出す(省略 = 下限なし)' }
        maxIOSBuild: { type: integer, minimum: 1, description: 'この CFBundleVersion 以下だけに出す(省略 = 上限なし)。minIOSBuild 以上' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 機械可読コード(`ai_paused` は ai だけ・#511)
              enum:
                - ai_paused
                - app_check_failed
                - bad_request
                - internal
                - invalid_dsl
                - invalid_record
                - invalid_transaction
                - not_found
                - payload_too_large
                - rate_limited
                - transaction_owned_by_other
                - unauthenticated
                - unpublished
                - version_conflict
            message: { type: string }
            details: { type: object, additionalProperties: true }
            requestId: { type: string }
    Entitlements:
      type: object
      required: [isPro, pro]
      properties:
        isPro: { type: boolean, description: '取り消されていない・期限内・許可された環境の Pro がある' }
        pro:
          description: 'users/{uid}/entitlements/pro(無ければ null)'
          oneOf:
            - type: 'null'
            - type: object
              required: [productId, originalTransactionId, transactionId, environment, expiresAt, updatedAt]
              properties:
                productId: { type: string, example: jp.kz2601.metamon.pro.monthly }
                originalTransactionId: { type: string }
                transactionId: { type: string }
                environment: { type: string, enum: [Sandbox, Production] }
                expiresAt: { type: string, format: date-time }
                revokedAt: { type: string, format: date-time, description: '返金・取り消しの時刻(無ければ省略)' }
                updatedAt: { type: string, format: date-time }
    AppSummary:
      type: object
      required: [id, name, currentVersion, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        currentVersion: { type: integer }
        status: { type: string, enum: [active, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sortIndex: { type: integer, minimum: 1, description: '変身一覧で自分が並べた位置(1 が先頭・#277)。並べ替えたことが無いアプリには無い' }
    AppWithDSL:
      allOf:
        - { $ref: '#/components/schemas/AppSummary' }
        - type: object
          required: [dsl]
          properties: { dsl: { $ref: '../dsl/dsl.schema.json' } }
    DSLEnvelope:
      type: object
      required: [appId, version, dsl]
      properties:
        appId: { type: string }
        version: { type: integer }
        dsl: { $ref: '../dsl/dsl.schema.json' }
        source: { $ref: '#/components/schemas/VersionSource' }
        createdAt: { type: string, format: date-time }
    VersionSource:
      type: object
      description: このバージョンが生まれた経緯
      required: [kind]
      properties:
        kind: { type: string, enum: [ai, manual, restore, system, import] }
        mode: { type: string, enum: [full, patch], description: 'full = PUT (初回/create/fallback), patch = PATCH (編集)' }
        transcript: { type: string, description: ユーザー発話 (ai) }
        summary: { type: string, description: 変更の一文要約 (iOS が読み上げ) }
        model: { type: string }
        restoredFrom: { type: integer }
    VersionSummary:
      type: object
      required: [appId, version, createdAt]
      properties:
        appId: { type: string }
        version: { type: integer }
        parentVersion: { type: integer }
        source: { $ref: '#/components/schemas/VersionSource' }
        patch:
          type: array
          description: このバージョンを作った RFC 6902 ops (PATCH 経由の時のみ)
          items: { $ref: '../dsl/dsl.schema.json#/$defs/PatchOp' }
        createdAt: { type: string, format: date-time }
    RestoreResult:
      description: restore の応答。VersionSummary + 復元後の dsl(DSLEnvelope と互換)
      allOf:
        - { $ref: '#/components/schemas/VersionSummary' }
        - type: object
          required: [dsl]
          properties: { dsl: { $ref: '../dsl/dsl.schema.json' } }
    RecordData:
      type: object
      description: 'キー = Field.id。値の型は Field.type に従う: string/text→string, integer/currency→integer, number→number, boolean→boolean, date→"YYYY-MM-DD", datetime→RFC3339, enum→options のいずれか, photo→https URL (iOS が Firebase Storage へ直接アップロード), location→"lat,lng", ref→参照先レコードの id 文字列(存在は検査しない・iOS の未送信 "local-<clientId>" も形として受ける)。例外として date field の隣の "<field>__dates" は毎日チェックの押した日の履歴("YYYY-MM-DD" の配列・DSL に宣言しない・昇順/重複除去/最大 400 件に正規化・#172)'
      additionalProperties:
        anyOf: [{ type: string }, { type: number }, { type: integer }, { type: boolean }, { type: 'null' }, { type: array, items: { type: string, format: date }, maxItems: 400 }]
      example: { amount: 1200, category: 食費, memo: ランチ, date: '2026-10-24' }
    Record:
      type: object
      required: [id, entity, data, createdAt, updatedAt]
      properties:
        id: { type: string, example: rec_01HXYZ }
        entity: { type: string }
        data: { $ref: '#/components/schemas/RecordData' }
        author: { type: string, description: '投稿者 uid。entity.scope が public/shared のレコードにだけ付く (private では省略)' }
        authorName: { type: string, description: '投稿者の表示名。POST の authorName、無ければ "匿名"。public/shared のみ' }
        marks: { type: object, additionalProperties: { $ref: '#/components/schemas/MarkState' }, description: 'entity.marks の印ごとの状態 (#255)。marks を宣言した public/shared entity の GET / PATCH だけ。宣言した印は件数 0 でも必ず入る' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MarkState:
      type: object
      required: [count, mine]
      properties:
        count: { type: integer, minimum: 0, description: '印を付けている人数' }
        mine: { type: boolean, description: '呼び出した本人が付けているか' }
    Share:
      type: object
      required: [token, appId, name, dslVersion, url, webUrl]
      properties:
        token: { type: string }
        appId: { type: string }
        name: { type: string }
        dslVersion: { type: integer, description: スナップショットした version }
        url: { type: string, example: 'tailorit://import/H6-GGDdrAGTqrpqpbKhx4GG1ZT1VJ0Rb', description: iOS アプリで開く URL(QR もこれ) }
        webUrl: { type: string, description: 'ブラウザ用の共有ページ(認証不要の `GET /s/{token}`・HTML。アプリの画面を読むだけで描き、レコードは出さない。「アプリで開く」と App Store への導線つき・#362。JSON の API ではないのでこの仕様には載せない)。`SHARE_WEB_BASE_URL` で上書き可' }
        revoked: { type: boolean }
        createdAt: { type: string, format: date-time }
    PublicApp:
      type: object
      required: [id, name, installs]
      properties:
        id: { type: string, description: 掲載者の appId }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        authorName: { type: string }
        components: { type: array, items: { type: string }, description: '使っている部品の type(コンテナ・voiceInput を除く・最大 8)。カードのアイコン用' }
        dslVersion: { type: integer }
        installs: { type: integer }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        hidden: { type: boolean, description: '運営が非公開にした(#321)。掲載者本人の掲載にだけ付く' }
        hiddenReason: { type: string, description: 運営の理由(掲載者に見せる) }
    ReportResult:
      type: object
      required: [id, created]
      properties:
        id: { type: string }
        created: { type: boolean }
    Block:
      type: object
      required: [uid, name, createdAt]
      properties:
        uid: { type: string }
        name: { type: string, description: '未設定は "匿名"' }
        createdAt: { type: string, format: date-time }
    ReleaseRequest:
      type: object
      required: [id, appId, name, dslVersion, purpose, status]
      properties:
        id: { type: string, example: rr_06GPVRYJ58VK8KN57T8W54M124 }
        appId: { type: string }
        name: { type: string, description: 申請時のアプリ名 }
        dslVersion: { type: integer, description: スナップショットした version(DSL 本体はレスポンスに含めない) }
        purpose: { type: string }
        contact: { type: string }
        status: { type: string, enum: [received, reviewing, planned, declined], description: 'received=受付 / reviewing=検討中 / planned=リリース予定 / declined=見送り。管理者がコンソールで変更' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: 'API が書いた時刻(コンソールで status を変えても自動では更新されない)' }
    InstallResult:
      description: AppWithDSL + 複製の結果
      allOf:
        - { $ref: '#/components/schemas/AppWithDSL' }
        - type: object
          properties:
            joined: { type: boolean, description: 'true = 共有データ付きなので元の appId に参加した' }
            created: { type: boolean, description: 'false = 既に持っていた(参加済み)' }
            member: { type: boolean, description: 'true = scope:shared のデータの参加者になった(import だけ・#254)' }
    Member:
      type: object
      required: [uid, displayName, role, you]
      properties:
        uid: { type: string }
        displayName: { type: string, description: 'import 時の displayName(無ければ空。作成者は常に空)' }
        role: { type: string, enum: [owner, member] }
        via: { type: string, enum: [share, legacy], description: 'share = リンクで参加 / legacy = #254 以前からアプリを持っていた(移行)。作成者には無い' }
        joinedAt: { type: string, format: date-time, description: 作成者には無い }
        you: { type: boolean, description: 呼び出したユーザー本人 }
    Interest:
      type: object
      description: 「つながりたい」1 件 / つながった 1 人(#507)
      required: [uid, status, updatedAt]
      properties:
        uid: { type: string, description: 相手の uid }
        profileRecordId: { type: string, description: 相手のプロフィールのレコード id(送った時のもの。消されていることがある) }
        status: { type: string, enum: [matched, pending] }
        updatedAt: { type: string, format: date-time }
        matchedAt: { type: string, format: date-time, description: matched の時だけ }
