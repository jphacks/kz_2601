# 版はここだけで決める(#356)。上げる時は android/README.md の「版を上げる」を見る。
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
# link を Custom Tabs で開く
browser = "1.9.0"
# https の画像(image / avatar / photoField)。OkHttp は下の okhttp を共有する。3.6 は Compose 1.12(compileSdk 37)を求めるので 3.5 に留める
coil = "3.5.0"
coreKtx = "1.18.0"
# icon / label の Material アイコン(BOM から外れたので版を書く)。extended の絵は scripts/gen-symbol-icons.py で必要な分だけ取り込む(#842)
materialIconsCore = "1.7.8"
# videoPlayer の再生(ExoPlayer + PlayerView・#863)と videoField の書き直し(Transformer・#1202)。1.11 は compileSdk 36 で通る
media3 = "1.11.1"
# dashcam のループ録画(Preview + VideoCapture・#872)。1.6 は compileSdk 36 で通る。権限はマニフェストに足さない
camerax = "1.6.2"
lifecycle = "2.10.0"
kotlinxSerialization = "1.12.0"
kotlinxCoroutines = "1.11.0"
firebaseBom = "35.1.0"
googleServices = "4.5.0"
crashlyticsGradle = "3.0.8"
credentials = "1.5.0"
googleid = "1.1.1"
junit = "4.13.2"
# 画面のテスト(androidTest・#1314)。Compose の ui-test は compose-bom の版
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# qrCode の生成(core だけ・Android の依存なし・#861)
zxing = "3.5.3"
# qrScanner の読み取り(Google Code Scanner・CAMERA の権限が要らない・#866)
playServicesCodeScanner = "16.1.0"
# 場所に着いたら知らせる(near)の見張り(Geofencing・端末の中で判定)
playServicesLocation = "21.4.0"
# fileImport の PDF: スキャンのページの文字認識(端末内・認識の部品は Play 開発者サービスが落とす・#1181)
playServicesMlkitTextRecognitionJapanese = "16.0.2"
# photoField.analyze(#1119): バーコード・画像のラベル・顔の数。どれも Play 開発者サービスが部品を落とす版(APK はほぼ増えない)
playServicesMlkitBarcodeScanning = "18.3.1"
playServicesMlkitFaceDetection = "17.1.0"
playServicesMlkitImageLabeling = "16.0.8"
# fileImport の PDF: 文字の層の取り出しとページの描画(Apache-2.0・#1181)。証明書の暗号化に使う BouncyCastle は外す(#1319)
pdfboxAndroid = "2.0.27.0"
# nearbyShare の送受信とすれ違い(Nearby Connections・#1380)。同じ OS どうしだけ(iOS とはつながらない・#1384)
playServicesNearby = "19.5.1"
# Tailor It Pro の定期購入(Google Play Billing・#77 の Android 版)。Play の規約(OSS ではない)
playBilling = "9.1.0"
# Play の In-App Updates(更新の画面からその場で更新を始める)。Play Core の規約(OSS ではない)
playAppUpdate = "2.1.0"
# mapView / locationPicker の地図(BSD-2-Clause・#867)。描画は OpenGL ES 版(Vulkan 版より多くの端末・エミュレータで動く)。タイルは OpenFreeMap(キー不要)・components/map/MapStyle.kt
maplibre = "13.7.1"
# 5.5 は compileSdk 37 を求める。compileSdk を上げるまで 5.4 に留める
okhttp = "5.4.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
